[StructuralControl]

# THREE PINS. TWO ARE SUBSCRIPTS THE REFERENCE DOES NOT GUARD, AND THE THIRD IS
# THE `interp1d` SIZE TIE THIS FILE ALREADY CARRIES TWICE.
#
# `StC_Group_N` bounds BOTH of this unit's loops and bounds nothing else:
#
#     Controllers.f90:1006  DO I_GROUP = 1,CntrPar%StC_Group_N
#                               ... CntrPar%Ind_StructControl(I_GROUP) ...
#                               ... CntrPar%OL_StructControl(I_GROUP,:) ...
#                               ... LocalVar%StC_Input(I_GROUP) ...
#     Controllers.f90:1020  DO I_GROUP = 1, CntrPar%StC_Group_N
#                               avrSWAP(CntrPar%StC_GroupIndex(I_GROUP)) = ...
#
# and NOTHING in this procedure relates the bound to any of the four arrays it
# subscribes. The relation is established by the reference's own reader, and it
# is the same shape as PreFilterMeasuredSignals' above:
#
#     ReadSetParameters.f90:583  ParseInput(..., 'StC_Group_N', CntrPar%StC_Group_N, ...)
#     ReadSetParameters.f90:584  ParseAry(..., CntrPar%StC_GroupIndex,    CntrPar%StC_Group_N, ...)
#     ReadSetParameters.f90:589  ParseAry(..., CntrPar%Ind_StructControl, CntrPar%StC_Group_N, ...)
#
# so `SIZE(StC_GroupIndex) == SIZE(Ind_StructControl) == StC_Group_N` by
# construction, always. `LocalVar%StC_Input` is separately fixed at 12 by the
# type, and the reference's own comment at Controllers.f90:1053 states the
# relation the reader enforces: *"LocalVar%StC_Input() has a fixed max size of
# 12, which can be increased in rosco_types.yaml"*.
#
# THE UPPER BOUND IS 3 BECAUSE 3 IS THE SMALLEST EXTENT R5 GENERATES --
# `_extent_plan` builds `[3 + bump + i]` and the extent-1 shape exists only when
# R5 is ABLATED. Inside 0..3 neither loop can leave any of the four arrays at
# any shape the generator draws. Identical reasoning, and identical number, to
# `CntrPar_F_GenSpdNotch_N` above.
#
# THE COST, STATED. `StC_Group_N` leaves R6's integer ladder, so the decade
# boundaries and the two 32-bit extremes are gone from it -- and every one of
# those is a value at which the REFERENCE reads and writes past four arrays, so
# nothing observable is lost. What remains is 0 (both loops skipped, which is
# what every scenario that leaves StC_Mode at 0 does), 1 (what all three
# scenarios that enable this unit do) and 2..3, which no scenario reaches.
CntrPar_StC_Group_N = { lo = 0, hi = 3 }

# `StC_GroupIndex(I_GROUP)` IS ITSELF AN `avrSWAP` SUBSCRIPT, and it is the only
# place in this unit where a drawn VALUE -- not a count -- lands in a subscript:
#
#     avrSWAP(CntrPar%StC_GroupIndex(I_GROUP)) = LocalVar%StC_Input(I_GROUP)
#
# `avrSWAP` is an assumed-size dummy, `REAL(ReKi) :: avrSWAP(*)`, so the
# reference has no extent to check against even in principle and gfortran cannot
# bounds-check it. This campaign's stated extent is 3000 (`vit.yaml`
# `assumed_size_arrays`), which is also what the harness allocates, so any drawn
# index outside 1..3000 is a WRITE past a 3000-element buffer -- past the
# comparison's own copy of it -- rather than a wrong answer.
#
# The bound is the campaign's declared extent, not a round number. The shipped
# inputs sit far inside it: `StC_GroupIndex` is 2801 in all three scenarios that
# set it (`Examples/vit_sim.py` scenarios 3, 7 and 27), and ROSCO's Bladed-style
# record numbering puts the structural-control block at 2801 onward.
#
# THE COST, STATED. The corpus can no longer place a group index at 0, at a
# negative value or past the end of `avrSWAP` -- so a translation that wrote
# `avrSWAP[idx]` instead of `avrSWAP[idx - 1]` still disagrees everywhere inside
# the range and there is nothing lost there, but an off-by-one AT the last slot
# (index 3000 writing element 3001) has no case to be caught on. That defect is
# undefined behaviour in the reference too, so no oracle exists for it.
CntrPar_StC_GroupIndex = { lo = 1, hi = 3000 }

# THE `interp1d` SIZE TIE, FOR THE THIRD TIME IN THIS FILE -- see `[interp1d]`'s
# `n_yData` and `[PowerControlSetpoints]`'s three OL_ entries. The call is
#
#     interp1d(CntrPar%OL_Breakpoints, CntrPar%OL_StructControl(I_GROUP,:), ...)
#
# and the second argument is a ROW of a 2-D array, so the length that has to
# match `SIZE(OL_Breakpoints)` is the COLUMN count. `_extent_plan` makes extents
# pairwise distinct on purpose, which here means every `StC_Mode == 2` case with
# a positive `Ind_StructControl` would reach `interp1d`'s
# `SIZE(xData) .NE. SIZE(yData)` arm, whose internal WRITE formats 53 characters
# into the 38-character record the statement above it allocated and kills the
# process.
#
# The relation is the reader's, as with the other two: `Read_OL_Input` allocates
# `OL_StructControl(N_OL_StCs, SIZE(CntrPar%OL_Channels, DIM=1))` and fills each
# row from `OL_Channels(:, ...)`, whose first dimension is the breakpoint count.
#
# ROWS ARE NOT TIED, deliberately: rows stays distinct from cols, so a
# translation that strode this column-major array by the column count instead of
# the row count still disagrees. That is the property `_extent_plan`'s pairwise
# distinctness exists to protect, and only the one pair that the reference
# cannot survive gives it up.
CntrPar_OL_StructControl_cols = { same_as = "CntrPar_OL_Breakpoints_n" }

# ---------------------------------------------------------------------------
# interp2d
#
# TWO TIES, AND BOTH ARE THE `interp1d` TIE ONE DIMENSION UP. Unit #45.
#
# The reference's first two statements are
#
#     IF (SIZE(xData) .NE. SIZE(zData,2)) THEN
#         ErrVar%aviFAIL = -1
#         WRITE(ErrVar%ErrMsg,"(A,I4,A,I4,A)") " SIZE(xData) =", SIZE(xData), &
#         ' and SIZE(zData,1) =', SIZE(zData,2),' are not the same'
#
# and the same again for `SIZE(yData) .NE. SIZE(zData,1)`. Unlike interp1d's
# version there is NO literal assignment in front of the WRITE, so it formats 59
# characters into `ErrVar%ErrMsg` AT WHATEVER LEN IT ALREADY HAS -- and
# `DISCON.F90:159` sets `ErrVar%ErrMsg = ''` on every controller call. MEASURED:
#   evidence/interp2d/reference.size-mismatch-aborts.txt
#       LEN(ErrMsg) = 0, characters the WRITE formats = 59,
#       "Fortran runtime error: End of record", exit 2.
#
# `_extent_plan` makes extents PAIRWISE DISTINCT on purpose, so without these
# two lines the very first generated case kills the oracle and the run produces
# no JSON at all -- which is exactly what interp1d's untied first run did
# (evidence/interp1d/harness.untied-extents-KILLS-the-reference.txt).
#
# THE COST, STATED: the two size-mismatch branches and the four sites inside
# them are unreachable by this harness, and so is any defect that needs an
# extent to disagree with the matrix dimension it must equal.
#
# WHAT IS NOT GIVEN UP, and it is the property that matters most for a
# column-major 2-D argument: `n_zData_rows` and `n_zData_cols` are tied to
# DIFFERENT partners, so they stay distinct from each other. A translation that
# strode `zData` by the column count instead of the row count -- the defect
# `vit check`'s `column-major-stride` exists for, and the one this unit's row
# gather could most easily commit -- still disagrees on every case. Tying both
# extents to one number would have made the array square and deleted that.
#
# AND TWO `ordered_only` ENTRIES, WHICH ARE THE FOURTH JUDGEMENT THIS FILE
# CARRIES and are new at this unit. `interp2d` CHECKS that both breakpoint
# vectors are strictly increasing, REPORTS that they are not, and then
# interpolates anyway. On a reversed table every interior query leaves the
# corner search at `j = 0` (or `i = 0`), and
#
#     fQ(1,1) = zData(i,j)
#
# reads one column BEFORE the array. The reference reads what precedes ITS
# buffer and the translation reads what precedes ITS OWN, so the two disagree on
# a value neither of them defines. MEASURED, not argued: with the ladder in,
# 1117 cases produce 6 out-of-bounds corner reads and 5 of the 6 disagree
# (evidence/interp2d/harness.out-of-bounds-corner-census.txt), every mismatch on
# `vit_result` and none on any other output.
#
# That is unit #41's rule exactly -- a red result that is really an undefined
# reference cannot be told from a translation defect, and `vit_mutate.py`
# refuses to score against a red baseline, so nothing downstream could close
# either.
#
# THE COST, STATED, and it is the sharpest cost in this file. Two rules stop
# leaving the ascending domain for these two arrays:
#
#   * R6's ordering sweep -- reversed, one adjacent pair inverted at the first /
#     an interior / the last position, the ADJACENT EQUAL PAIR and the constant
#     array, at three step scales.  88 cases.
#   * R10's REVERSED body, which exists so that a reduction's extremum is once
#     the first element and once the last.
#
#   * THE TWO STRICTLY-INCREASING CHECKS GO DEAD, and this line first said the
#     opposite. It said the ordinary random draws would still reach them "one
#     time in six". They do not: `harness/generate._fill_array` draws STRICTLY
#     INCREASING bodies by construction -- "a table of breakpoints must stay
#     ordered for the reference's own search to be meaningful" -- so once these
#     two entries remove the ordering sweep and R10's reverse, NO CASE IN THE
#     CORPUS HAS A NON-INCREASING TABLE.
#
#     The correction is a measurement, not a re-reading: `ErrVar->aviFAIL = -1`
#     inside the `fail` lambda those two checks alone call, mutated to `-2`,
#     SURVIVED the sweep -- and `ErrVar.aviFAIL` is compared on all 1005 cases,
#     so one execution would have killed it. 14 of the unit's 32 survivors are
#     in that dead code (evidence/interp2d/mutation.census.txt, group 1).
#
#     The original sentence is kept above rather than deleted: it was the belief
#     the exclusion was written under, and the sweep is what refuted it.
#   * What IS lost is the EQUAL adjacent pair, and it is the only input on which
#     `xData(I+1) - xData(I) <= 0` and `< 0` give different answers. A mutant
#     that weakens either check to `<` has nothing here to kill it: `_fill_array`
#     draws strictly increasing bodies and random doubles never repeat, so no
#     other rule reaches it.
#   * And R10's reverse is given up, which is the DYNAMIC witness for
#     `MINVAL(xData)` written as `xData(1)`. On an ascending body the two are
#     the same number. `vit check`'s `minval-endpoints` is the static witness
#     for that same defect and it RAN on this translation (15 checks, 0
#     findings); what is lost is a case that could have failed, not the check.
#
# Neither loss is a property of this generator: both are consequences of a
# reference that reports a malformed table and then subscripts with it.
#
# ================== SECOND DISPATCH, 2026-08-15 ==========================
#
# EVERYTHING ABOVE IS KEPT AND THE LAST TWO BULLETS ARE WRONG, AND THE SWEEP IS
# WHAT SAYS SO. `ordered_only` was one shape too wide. It excluded every body
# that is not strictly ascending; what this reference cannot survive is an
# INVERSION, and the ADJACENT EQUAL PAIR and the CONSTANT ARRAY are not
# inversions.
#
# THE ARGUMENT, and it is about the reference's own guard rather than about the
# bodies. The corner search runs only in the ELSE arm of
#
#     IF (xq <= MINVAL(xData) .OR. ieee_is_nan(xq)) ... ELSEIF (xq >= MAXVAL(xData)) ... ELSE
#
# so it runs only when `xq > MINVAL(xData)`. On a NON-DECREASING body
# `MINVAL(xData)` IS `xData(1)`, so the first iteration tests `xq == xData(1)`
# (false) and `xq < xData(1)` (false), falls through, and `jj` is never 1 --
# therefore `j = jj - 1` is never 0 and `zData(i, 0)` cannot arise. An INVERTED
# body is exactly the case that breaks the identity: its minimum is not its
# first element, and a query between the two subscripts one column early. The
# 6 out-of-bounds reads the census measured are all of that shape.
#
# So the two entries become `nondecreasing_only`, which is the same exclusion
# with the line drawn where the reference draws it. WHAT COMES BACK:
#
#   * the ADJACENT EQUAL PAIR at the FIRST, an INTERIOR and the LAST position,
#     and the CONSTANT array, at every step scale -- the bullet above says this
#     is "the only input on which `<= 0` and `< 0` give different answers", and
#     it is now in the corpus.
#   * R10 pins `xq` to `MINVAL(xData)`/`MAXVAL(xData)` over those same bodies
#     rather than over the reverse, which is what reaches an extremum that is
#     NOT UNIQUE: `xq == MINVAL` on a CONSTANT table separates `xq <= MINVAL`
#     from `xq < MINVAL` (the first returns column 1, the second falls to the
#     `>= MAXVAL` arm and returns column SIZE(xData)), and `xq == MAXVAL` on a
#     table whose maximum REPEATS separates `xq >= MAXVAL` from `xq > MAXVAL`
#     (the first returns the LAST column, the second searches and stops at the
#     FIRST column holding it).
#
# WHAT IS STILL GIVEN UP, unchanged and now the whole of the cost:
#
#   * the reversed body and the three pair-inverted bodies. So `MINVAL(xData)`
#     written as `xData(1)` still has no dynamic witness -- on every body this
#     corpus now contains, the two are the same number. `vit check`'s
#     `minval-endpoints` remains the static witness.
#   * and with them, any case in which `xData(1)` is not the minimum. That is
#     the input which separates the corner search's `DO j = 1, SIZE(xData)`
#     from a search starting at 2, and it is why two of this unit's survivors
#     have no case: see evidence/interp2d/mutation.census.txt, group 5.
#
# Neither loss is a property of this generator: both are consequences of a
# reference that reports a malformed table and then subscripts with it.
[interp2d]
n_zData_cols = { same_as = "n_xData" }
n_zData_rows = { same_as = "n_yData" }
xData = { nondecreasing_only = "the reference reads zData(i, 0) on an INVERTED table and cannot on a tied one, because its search runs only where xq > MINVAL(xData) and a non-decreasing body has MINVAL(xData) == xData(1) -- see above" }
yData = { nondecreasing_only = "the reference reads zData(0, j) on an INVERTED table and cannot on a tied one, for the same reason one dimension over -- see above" }

