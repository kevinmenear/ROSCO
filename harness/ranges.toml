# Stated admissible ranges for this campaign's differential harness.
#
# THIS FILE IS THE ONLY JUDGEMENT IN THE PIPELINE, and it is committed for that
# reason. Everything else the harness does is derived: the signature from VIT,
# the read set from the Fortran body, the values from the rules. What goes here
# is a person saying "this input is not admissible", and every entry NARROWS the
# generated domain -- which is the blindness the generator exists to remove. So
# each one carries the measurement or the source line that forces it, and an
# entry with only an assertion behind it does not belong here.
#
# Read with `harness/statevary.py::constrain`. `text = "..."` pins a CHARACTER
# parameter's contents; `lo`/`hi` pin a number; `values` pins an enumeration.

# ---------------------------------------------------------------------------
# ExtController
#
# Four pins, and all four exist because the REFERENCE CRASHES on the rest of the
# domain rather than because the translation would. That is a fact about
# upstream ROSCO and it is the reason this unit needed an oracle fixture at all:
# `ExtController` never checks `ErrVar%ErrStat` after `LoadDynamicLib`, so any
# input that fails to load a library reaches
#
#     CALL C_F_PROCPOINTER( DLL_Ext%ProcAddr(1), DLL_Legacy_Subroutine )
#     CALL DLL_Legacy_Subroutine ( ... )
#
# with `ProcAddr(1)` still `C_NULL_FUNPTR` -- SIGSEGV, measured on this
# campaign's own inputs at `evidence/ExtController/probe_ext_mode_1.json`.
#
# So the admissible domain of this procedure really is this narrow. What the
# harness would otherwise generate is not "more coverage", it is 218 signals.

[ExtController]

# The library the reference loads. `fixtures/bladed_stub/discon_stub.c`, built
# by its own build.sh. An absolute path because `LoadDynamicLib` passes it
# straight to `dlopen`, whose search rules are not the process's cwd.
#
# THE COST, STATED: `DLL_FileName` is held at one value, so nothing this harness
# does can distinguish a translation that reads it from one that ignores it.
# What still constrains it is `CntrPar_DLL_InFile`, which is NOT pinned -- it is
# built by the same TRIM/TRANSFER shape, its trimmed length is record 50, and
# the oracle folds its bytes into record 46.
CntrPar_DLL_FileName = { text = "/workspace/ROSCO-r2/fixtures/bladed_stub/libdiscon_stub.so" }

# The symbol `LoadDynamicLibProc` looks up with `dlsym`. Anything else returns a
# null `ProcAddr` and reaches the same CALL. "DISCON" is what all 14
# `Examples/*.IN` say and what the fixture exports (build.sh asserts it).
CntrPar_DLL_ProcName = { text = "DISCON" }

# THE INITIALISATION BRANCH, ON EVERY CASE -- and the two pins below are one
# decision, not two.
#
# `LocalVar%iStatus == 0` guards the branch that loads the library. `DLL_Ext` is
# a SAVE local, so a case with `iStatus /= 0` before any case has loaded it
# reaches the null `ProcAddr` again. Ordering the case set instead -- one
# `iStatus == 0` case first, the rest not -- is not something this generator can
# express: it chooses each parameter independently of the others and of the case
# index, and teaching it otherwise would be a per-case schedule that no other
# unit needs.
#
# Holding `iStatus == 0` takes the branch every time, which is the SAFE side:
# the four statements the other path skips are then always executed, and the
# only thing unexercised is their absence.
#
# WHAT IS NOT COVERED, stated rather than left to be found: the `iStatus /= 0`
# path. It skips `DLL_Ext%FileName`/`%ProcName`, `LoadDynamicLib`, the ALLOCATE
# and four PRINTs; everything after `END IF` -- the copy, the three length
# records, the call and the error-message branch -- runs identically on both
# paths and IS covered. A defect confined to "does the guard fire at all" is
# invisible here, and `mutation/ExtController.json` is where that shows up.
LocalVar_iStatus = { values = [0] }

# `ExtDLL%avrSWAP` UNALLOCATED on entry, which is what -1 means to the
# decomposed bridge (see `vit/test_validate.py`: n < 0 unallocated, n == 0
# allocated-empty, n > 0 allocated). Forced, not chosen: the branch above runs
# `ALLOCATE(ExtDLL%avrSWAP(max_avr_entries))`, and Fortran ABORTS on an ALLOCATE
# of an already-allocated variable. Supplying it allocated would end 218 of 218
# cases in "Attempting to allocate already allocated variable".
#
# It is also the input the shipped program has: the guard is `iStatus == 0`,
# the first call, where the field has never been allocated.
ExtDLL_avrSWAP_n = { lo = -1, hi = -1 }

# ---------------------------------------------------------------------------
# UpdateZeroMQ
#
# One pin, and like ExtController's four it exists because the REFERENCE STOPS
# on the rest of the domain rather than because the translation would.

[UpdateZeroMQ]

# `CntrPar%ZMQ_CommAddress` is `CHARACTER(256)` and so is the local it is
# written into:
#
#     character(256) :: zmq_address
#     write (zmq_address, '(A,A)') TRIM(CntrPar%ZMQ_CommAddress), C_NULL_CHAR
#
# An address occupying the full declared width therefore needs LEN_TRIM + 1 =
# 257 characters of a 256-character record, and gfortran ends the program:
# `Fortran runtime error: End of record`, exit 2, measured standalone at
# `evidence/UpdateZeroMQ/domain_aborts.run.txt` and then measured AGAIN by this
# harness -- the first generated run died at ZeroMQInterface.f90:53 and wrote no
# JSON at all, which is what a corpus case reaching it looks like from here.
# `harness/generate.py` plants corpus characters at an interior position of an
# ORDINARY string, and an ordinary string of a 256-wide parameter is 256
# characters with no trailing blank.
#
# That is upstream ROSCO's defect (the fourth this campaign has recorded), not
# something a translation can mirror: a run that aborts produces no case, so
# there is nothing for either side to answer.
#
# THE COST, STATED: the address is held at one value, so nothing this harness
# does can distinguish a translation that reads `ZMQ_CommAddress` from one that
# ignores it. It costs less here than the same pin would cost anywhere else --
# in the configuration under translation (`ZMQ_CLIENT` undefined) the reference
# writes the address into a local that only the uncompiled `zmq_client` call
# reads, so there is no answer that depends on it. See the header of
# `translations/ZeroMQInterface/updatezeromq.cpp`.
#
# The value is the one all 14 `Examples/DISCON*.IN` carry.
CntrPar_ZMQ_CommAddress = { text = "tcp://localhost:5555" }

# THE EIGHT OUTPUTS THE REFERENCE HAS NO ANSWER FOR.
#
# `no_oracle` is not a range and does not narrow the input domain: it says that
# on this OUTPUT the reference is not a function of its arguments, so comparing
# against it decides nothing about either implementation. Every entry is
# reported in the run's own artifact (`no_oracle_outputs`) and a name matching
# no compared field is an error, so the cost cannot be paid silently.
#
# `UpdateZeroMQ` declares `real(C_DOUBLE) :: setpoints(8)`, and in the
# configuration this campaign compiles -- `ZMQ_CLIENT` undefined, because
# `pkg_check_modules(PC_ZeroMQ libzmq)` does not find the library -- NOTHING
# WRITES IT. The `call zmq_client(zmq_address, turbine_measurements, setpoints)`
# that would is inside the `#ifdef`. The procedure then copies the array into
# these eight fields.
#
# MEASURED TWICE, FROM BOTH SIDES:
#   evidence/UpdateZeroMQ/setpoints_indeterminate.run.txt
#       three calls in one process. Fresh frame -> NaN, 9.75e-310, 2.62e-322.
#       After a routine that fills the same stack region with 1.0 -> 1.0.
#       After one that fills it with -7.25 -> -7.25. Six of the eight track the
#       previous frame verbatim.
#   evidence/UpdateZeroMQ/harness.setpoints-indeterminate-FAILS-4-of-4179.json
#       the first generated run: 4175 of 4179 cases agreed on every output and
#       4 disagreed on these fields alone, the reference answering
#       `68bb11a718b90000` -- a leftover pointer -- where the translation
#       answers 0.
#
# So the disagreement is not between two implementations of one thing. It is
# between one implementation and an absence, and it is upstream ROSCO's.
#
# THE COST, STATED: nothing in this harness can constrain what a translation
# writes to these eight fields, and every mutant confined to those eight
# assignments is unkillable for the same reason -- see mutation/UpdateZeroMQ.json.
# What is NOT excluded, and is what this unit's green then means: `aviFAIL`,
# `ErrMsg`, and the two predicates that decide whether either is written.
LocalVar_ZMQ_TorqueOffset = { no_oracle = "setpoints(1), never assigned in this build" }
LocalVar_ZMQ_YawOffset    = { no_oracle = "setpoints(2), never assigned in this build" }
LocalVar_ZMQ_PitOffset    = { no_oracle = "setpoints(3:5), never assigned in this build" }
LocalVar_ZMQ_R_Speed      = { no_oracle = "setpoints(6), never assigned in this build" }
LocalVar_ZMQ_R_Torque     = { no_oracle = "setpoints(7), never assigned in this build" }
LocalVar_ZMQ_R_Pitch      = { no_oracle = "setpoints(8), never assigned in this build" }

# ---------------------------------------------------------------------------
# interp1d
#
# ONE TIE, AND IT IS THE THIRD KIND OF JUDGEMENT THIS FILE CARRIES. `lo`/`hi`/
# `values`/`text` narrow ONE parameter on its own; `no_oracle` says an OUTPUT
# has no answer; `same_as` says two INPUTS are only JOINTLY admissible. It is
# reported in the run (`TIED EXTENT:`), it lands in R5's own detail line, and a
# name matching no extent is a hard error.
#
# THE REFERENCE DIES -- it does not merely report -- when the two sizes differ:
#
#     IF (SIZE(xData) .NE. SIZE(yData)) THEN
#         ErrVar%aviFAIL = -1
#         ErrVar%ErrMsg  = ' xData and yData are not the same size'   ! LEN 38
#         WRITE(ErrVar%ErrMsg,"(A,I2,A,I2,A)") " SIZE(xData) =", SIZE(xData), &
#         ' and SIZE(yData) =', SIZE(yData),' are not the same'       ! 53 chars
#
# `ErrMsg` is `CHARACTER(:), ALLOCATABLE`, so the assignment REALLOCATES it to
# 38 characters and the internal WRITE then formats 53 into that record.
# MEASURED, in isolation and in situ:
#   evidence/interp1d/reference.size-mismatch-aborts.txt
#       LEN after the assignment = 38, characters the WRITE formats = 53,
#       "Fortran runtime error: End of record", exit 2.
#   evidence/interp1d/harness.untied-extents-KILLS-the-reference.txt
#       the first generated run, at Functions.f90:118, before any case
#       completed: `_extent_plan` makes extents PAIRWISE DISTINCT on purpose,
#       so n_xData = 3 and n_yData = 4 in the very first case and the harness
#       produced no JSON at all.
#
# So this is not a domain the generator chose badly. It is a domain on which
# the reference has no answer to compare against -- unit #17's non-terminating
# inputs, one exit code over.
#
# THE COST, STATED: the size-mismatch branch and the six sites inside it are
# unreachable by this harness, and so is any defect that needs the two extents
# to DIFFER -- a translation that read `n_yData` where the reference reads
# `SIZE(xData)` (the `interp1d = yData(SIZE(xData))` line) agrees on every case
# here. Nor can a stride error that agrees at equal extents be caught. What is
# NOT excluded, and is what a green then means: all three interpolation
# branches, the strictly-increasing scan, the RoutineName prefix, and every
# arithmetic site in the interpolation itself.
[interp1d]
n_yData = { same_as = "n_xData" }

# ---------------------------------------------------------------------------
# CheckInputs
#
# THREE PINS, ALL THREE BECAUSE THE REFERENCE READS PAST THE END OF AN ARRAY.
# Same shape as ExtController's four above: the domain really is this narrow,
# and what the generator would otherwise produce is not more coverage but a
# SIGSEGV in the oracle.
#
# `CheckInputs` validates `AWC_NumModes` against 0 and against 2 and never
# against `SIZE(CntrPar%AWC_freq)`, and then, four lines later:
#
#     DO Imode = 1,CntrPar%AWC_NumModes
#         IF (CntrPar%AWC_freq(Imode) < 0.0) THEN
#
# `AWC_freq`, `AWC_clockangle` and `AWC_harmonic` are ALLOCATABLE and sized
# from the DISCON file; nothing in this subroutine relates the count to the
# extent. An input-validation routine reading out of bounds on its own input
# is upstream ROSCO's defect, not the harness's and not the translation's.
#
# MEASURED, not argued. R6's integer ladder put `AWC_NumModes` at 99999 with
# `n_AWC_freq` at 28, and case 9544 killed the ORACLE:
#
#     CASE 9544
#     CPP        <- the translation returned
#     F90        <- and then ./test died, SIGSEGV, core dumped
#
# The translation survived the same loop, which is luck and not correctness:
# 99999 doubles past a 28-element allocation is ~800 KB, and the C++ heap
# happened to have it mapped where the Fortran one did not. Both are undefined.
#
# THE BOUNDS ARE THE REFERENCE'S OWN PREDICATES, so no branch is lost:
# `AWC_NumModes` is tested `< 0`, `> 2` and `< 1`, so -1..3 reaches every arm
# of both `AWC_Mode == 1` and `AWC_Mode == 2`. `CC_Group_N` and `StC_Group_N`
# are pure loop bounds over `CC_GroupIndex` / `StC_GroupIndex`, whose only
# predicate is on the ELEMENT, so 0..2 reaches the empty loop, one iteration
# and more than one.
#
# THE COST, STATED: a translation that mis-handled a count LARGER than its
# array has nothing here to disagree with. That defect is unreachable in the
# reference too -- it has no defined answer there -- which is why the pin is
# admissible and why it is not free.

[CheckInputs]

CntrPar_AWC_NumModes = { lo = -1, hi = 3 }
CntrPar_CC_Group_N = { lo = 0, hi = 2 }
CntrPar_StC_Group_N = { lo = 0, hi = 2 }

# ---------------------------------------------------------------------------
# FindLine
#
# ONE PIN, AND THE REFERENCE'S OWN EXIT STATUS IS ITS BASIS. `AryLen` is an
# OPTIONAL INTEGER whose only use is
#
#     WordInd = AryLen + 1
#     ALLOCATE(Words(WordInd))          ! TODO: check error   <- the reference's comment
#
# and `Words` is then written by `GetWords` and read at `Words(WordInd)`. A
# WordInd of zero or less is a ZERO-SIZED Fortran array, so `Words(1)` is a
# write past the allocation and `Words(WordInd)` a read below it. The reference
# has no defined behaviour there, and it does not merely differ from a
# translation -- it DIES:
#
#     AryLen         reference (evidence/FindLine/arylen_probe.txt)
#     -2147483648    SIGSEGV  in __rosco_helpers_MOD_findline
#     -100 / -2 / -1 SIGABRT, `malloc(): corrupted top size`
#     0              returns -- FoundLine=F, LineNum=0
#     1 .. 100000    returns
#     2147483647     SIGSEGV -- AryLen + 1 overflows to -2147483648
#
# One value per process, thirteen processes, measured on the CLEAN tree against
# the Fortran body (evidence/FindLine/arylen_probe.{f90,sh,txt}). The generated
# corpus's first crash was case 0 of 2522, and R6's integer ladder puts both
# 32-bit extremes in it, so without this every mutation run would score against
# a program that segfaults before comparing anything.
#
# THE LOW BOUND IS THE BOUNDARY ITSELF, NOT A MARGIN. AryLen = 0 gives
# WordInd = 1 -- a one-element array, the narrowest defined case -- and it is
# REACHABLE in the shipped program: both call sites guard `IF (AryLen < 1)`
# immediately AFTER this call, so the caller anticipates it rather than
# excluding it.
#
# THE COST, STATED. Two things:
#   1. `AryLen` leaves R6's ladder, because `bounds_source` becomes `stated:`
#      and R6 applies to defaulted ranges. The decade boundaries and the two
#      32-bit extremes are gone -- and every one of them is a value at which
#      the reference aborts, so nothing observable is lost.
#   2. The upper bound is 32, where the reference is defined to at least
#      100000. Above the word count of the generated `FileLines` -- whose
#      element width R5 varies at 3..5 characters, so at most three words --
#      every value of WordInd selects the same thing: an element GetWords left
#      blank. 32 is eight times that ceiling, and a translation that mishandled
#      an AryLen of 100000 has nothing here to disagree with.

[FindLine]

AryLen = { lo = 0, hi = 32 }

# ---------------------------------------------------------------------------
# PIDController
#
# ONE PIN, AND THE PARAMETER NEXT TO IT IS WHY IT IS ONLY ONE. This unit has
# TWO 1-based Fortran indices into DIMENSION(1024) arrays, and only one of them
# needs a human judgement:
#
#   objInst%instPI   subscripts `piP%ITerm(...)` IN THIS UNIT'S OWN BODY, so the
#                    harness reads the role off the reference AND off the
#                    translation and R5 sweeps it at 1 / interior / n. Measured
#                    in the generated corpus: 0 of 4692 cases outside 1..1024.
#                    NOT PINNED -- an inferred role is stronger than a range.
#   objInst%instLPF  is subscripted inside the CALLEE:
#                        EFilt = LPFilter(..., objInst%instLPF)   Controllers.f90:1100
#                        FP%lpf1_a1(inst) = 2 + CornerFreq*DT     Filters.f90, LPFilter
#                    and the array it indexes is a field of `LocalVar%FP`, a
#                    NESTED type the generator does not expand into parameters.
#                    There is no compared out-parameter to attach the role to,
#                    so it stays an ordinary defaulted integer and R6's ladder
#                    puts both 32-bit extremes in the corpus: 4658 of 4692 cases
#                    outside 1..1024, 4572 of them at 0.
#
# WHAT THE REFERENCE DOES THERE, one value per process, fourteen processes,
# measured on the CLEAN tree (evidence/PIDController/instlpf_probe.{f90,sh,txt}):
#
#     instLPF                  reference
#     -2147483648              SIGSEGV in __filters_MOD_lpfilter
#     -100000                  SIGSEGV in __filters_MOD_lpfilter
#     -1000 / -300 / -2 / -1   returns
#     0                        returns
#     1 .. 1024                returns
#     1025 / 100000            returns
#     2147483647               SIGSEGV in __filters_MOD_lpfilter
#
# THE RETURNING ROWS ARE NOT A DEFENCE OF THE DOMAIN, they are the reason the
# bound is 1..1024 rather than "whatever does not crash". Every value outside
# 1..1024 that returns does so having READ AND WRITTEN six doubles outside the
# declared extent of `FP%lpf1_*`, and the two sides of this comparison do not
# have that memory in the same place: the C++ receives one `localvariables_view_t`
# struct, the Fortran bridge receives 167 decomposed scalars plus a pointer to
# FP alone. Agreement out there would be an accident of layout and disagreement
# would be a fact about layout. Neither says anything about the translation.
#
# 1..1024 is the whole DECLARED domain, not a margin: ROSCO_Types.f90:238-260
# gives every array LPFilter subscripts `DIMENSION(1024)`, and the shipped
# program sets `objInst%instLPF = 1` at the top of every timestep and increments
# it once per filter call.
#
# THE COST, STATED. `instLPF` leaves R6's ladder, because `bounds_source`
# becomes `stated:` and R6 applies to defaulted ranges. What that removes is the
# decade boundaries and the two 32-bit extremes -- every one of them a value at
# which the reference either dies or answers out of bounds. Nothing observable
# is lost, and the pin buys the harness the ability to run at all: without it
# the corpus segfaults before comparing anything, and 'harness produced no JSON'
# is also what a printing reference produces.

[PIDController]

objInst_instLPF = { lo = 1, hi = 1024 }

# THREE MORE PINS, ADDED AT THE RE-TAKE, AND THEY ARE THE OPPOSITE KIND OF
# JUDGEMENT FROM EVERY OTHER ENTRY IN THIS FILE. The eight above narrow a domain
# because the REFERENCE CRASHES or has no answer on the rest of it. These three
# narrow a domain because the reference ANSWERS A CONSTANT on the rest of it,
# and a constant answer is an absence wearing a value (P6).
#
# WHAT WAS MEASURED, on the corpus that scored 0.759 -- a census probe that
# writes one CSV row per call and changes NO compared output, so the run that
# produced it is GREEN and this is a reading of the corpus rather than a
# perturbation of it (evidence/PIDController/clamp_census.before.csv, read by
# census_report.py; 2307 ELSE-arm cases of 4610):
#
#     the return value == minValue or maxValue    2307 of 2307
#     minValue < maxValue at all                   207 of 2307
#     EFilt finite                                   1 of 2307
#     the raw sum PTerm+ITerm+DTerm finite           1 of 2307
#     the outer clamp INACTIVE                       0 of 2307
#
# The unit returns `saturate(PTerm + ITerm + DTerm, minValue, maxValue)`. On
# that corpus it returns a BOUND in every case, so PTerm, DTerm and the order of
# the sum reach no compared output at all -- which is exactly six mutation
# survivors: `kp*error -> kp`, `kp*error -> kp/error`, `EFilt-ELast ->
# EFilt+ELast`, `PTerm+ITerm -> PTerm-ITerm` and the two `[i] -> [i+1]` reads
# that feed only that sum. They are not equivalent mutants. They are unreachable
# ones, and the remedy is the inputs.
#
# TWO INDEPENDENT CAUSES, and fixing either alone leaves the number at zero.

# CAUSE 1 -- THE CALLEE DIVIDES BY A COEFFICIENT THE HARNESS ALWAYS SUPPLIES AS
# ZERO, so `EFilt` is NaN in 2306 of 2307 cases and the sum is NaN with it.
#
#     LPFilter = 1.0/FP%lpf1_a1(inst) * (-FP%lpf1_a0(inst)*... )   Filters.f90:65
#
# and `FP%lpf1_a1(inst)` is written ONLY inside
#
#     IF ((iStatus == 0) .OR. reset) THEN                          Filters.f90:53
#
# `LocalVar%FP` is a NESTED type: the generator zero-initialises it and does not
# vary it (this unit's `observability` says so). So on any case with
# `iStatus /= 0` and `reset` false the reference computes `1.0/0.0 * 0.0` = NaN,
# both sides agree on NaN, and the case is green and blind. `iStatus` was an
# ordinary defaulted integer on R6's decade ladder, which reaches 0 exactly
# once in 2307 cases.
#
# THE PIN IS THE REFERENCE'S OWN ENUMERATION, not a subset chosen to make the
# number move. Filters.f90:41 declares what the values mean:
#
#     ! A status flag set by the simulation as follows: 0 if this is the first
#     ! call, 1 for all subsequent time steps, -1 if this is the final call
#
# 0 is FIRST so that it is `values[0]`, the value every one-at-a-time ladder
# case runs at; R2 then runs each ladder value under all three. After: EFilt is
# finite in 1507 of 4884.
#
# THE COST, STATED. `iStatus` leaves R6's integer ladder, so the decade
# boundaries and the two 32-bit extremes are gone. Every one of them is a value
# on which this unit's only reader of `iStatus` divides by zero -- the ladder was
# buying NaN, which both sides produce identically and neither can be wrong
# about. What is NOT bought back: with a zeroed `FP`, the `iStatus /= 0` arm of
# LPFilter still answers NaN, so the RECURSIVE filter path remains unexercised
# from here. Reaching it needs a non-zero `FP` -- a nested type the generator
# does not vary -- and that is a gap in the generator, recorded in DECISIONS.md,
# not something a range can state.
LocalVar_iStatus = { values = [0, 1, -1] }

# CAUSE 2 -- THE TWO BOUNDS ARE DRAWN INDEPENDENTLY FROM ONE DEFAULT, so the
# pair that has to be an INTERVAL is an interval in 207 of 2307 cases, and never
# a WIDE one.
#
# `saturate(x, lo, hi)` is `MIN(MAX(x,lo),hi)`, which returns `hi` for every x
# once `lo >= hi`. On the +/-1e3 default both bounds take `_base(p, i)` -- one
# fixed fraction of the same range per parameter index -- and came out at
# minValue = 0, maxValue = -300 in 1512 of 2307 cases: an EMPTY interval. R6's
# isolating stage then pins every OTHER defaulted real to one value (0.0 or
# 1e300), which sets the two bounds EQUAL to each other, and an empty interval
# again.
#
# THE RANGES ARE THE ONLY CALL SITE'S OWN SHAPE, widened. Controllers.f90:346 is
# the single call in the whole program:
#
#     PIDController(LocalVar%AzError, ..., -LocalVar%VS_MaxTq*2, LocalVar%VS_MaxTq*2, ...)
#
# -- a bracket symmetric about zero whose half-width is twice a generator
# torque, i.e. strictly negative below and strictly positive above, at machine
# scale. These two entries state that and nothing narrower: minValue anywhere in
# [-1e9, -1e-3], maxValue anywhere in [1e-3, 1e9], drawn independently, so the
# bracket runs from 2e-3 wide to 2e9 wide and the ACTIVE arm keeps its coverage
# (the clamp still fires in 3568 of 4884).
#
# THE MAGNITUDE IS THE SCALE OF THE CLAMPED EXPRESSION, which is the half of
# this that fixed bounds get wrong: the terms are products of two +/-1e3 draws,
# so a +/-1e3 bracket clamps them whatever their order. Measured on the finite
# sums: |raw| has median 2994 and 90th percentile 1.86e6, and 1e9 is above both.
#
# AFTER, on the same census (evidence/PIDController/clamp_census.after.csv,
# 4884 ELSE-arm cases of 9758):
#
#     minValue < maxValue at all                  4884 of 4884   was 207 of 2307
#     the outer clamp INACTIVE                    1316 of 4884   was   0 of 2307
#     the ITerm clamp INACTIVE                    4285 of 4884   was   8 of 2307
#     both clamps inactive at once                1313 of 4884   was   0 of 2307
#
# THE COST, STATED. Both bounds leave R6's MAGNITUDE ladder and its isolating
# stage, because those apply only to reals whose range is defaulted. What that
# removes is the subnormal/overflow thresholds and 1e+/-300 for these two
# parameters -- values at which the clamp returns a bound for every input, which
# is the blindness this pin exists to remove. It also removes minValue >= 0 and
# maxValue <= 0: an INVERTED bracket is no longer generated, and a defect that
# only shows when `lo > hi` is invisible here. That defect would be in
# `saturate`, which is unit #24 and is CALLED, not inlined -- both sides of this
# comparison reach the same implementation of it, so this harness never
# constrained it in the first place.
minValue = { lo = -1e9, hi = -1e-3 }
maxValue = { lo = 1e-3, hi = 1e9 }

# ---------------------------------------------------------------------------
# PitchSaturation (unit #36)
#
# ONE PIN, and it is interp1d's pin re-stated at the caller. `PitchSaturation`
# passes `CntrPar%PS_WindSpeeds` and `CntrPar%PS_BldPitchMin` to `interp1d` as
# xData and yData, and the generator draws their two extents independently. On
# a case where they differ, `interp1d`'s upper-clamp arm returns
# `yData(SIZE(xData))` -- past the end of the shorter allocation -- so BOTH
# implementations read out of bounds and neither has an answer.
#
# MEASURED, with the failing artifact kept at
# evidence/PitchSaturation/harness_generator_defect/. 136 of 1292 cases failed,
# and every mismatch has the same signature: the C++ side reads the harness's
# zero-filled slack and returns 0.0, the Fortran side reads past a `ALLOCATE(n)`
# and returns a denormal whose bit pattern is a small integer --
# 1.63e-322 (0x21), 1.665e-321 (0x151), 1.033e-321 (0xd1). Those are integers
# living next to the allocation, not answers.
#
# THE SOURCE LINE THAT FORCES IT, and there is exactly one place these arrays
# are filled -- ReadSetParameters.f90:477-479:
#
#     CALL ParseInput(..., 'PS_BldPitchMin_N', CntrPar%PS_BldPitchMin_N, ...)
#     CALL ParseAry(  ..., 'PS_WindSpeeds',    CntrPar%PS_WindSpeeds,    CntrPar%PS_BldPitchMin_N, ...)
#     CALL ParseAry(  ..., 'PS_BldPitchMin',   CntrPar%PS_BldPitchMin,   CntrPar%PS_BldPitchMin_N, ...)
#
# Both arrays are allocated from the SAME count. A case where they differ is not
# a program state ROSCO can reach.
#
# THE COST, STATED: with the two extents tied, nothing in this harness can
# distinguish a translation that passes `n_PS_WindSpeeds` as interp1d's xData
# extent from one that passes `n_PS_BldPitchMin`, or either of those from
# `PS_BldPitchMin_N`. Three names for one number across the whole corpus. The
# kernel cannot separate them either (its arrays come from one DISCON.IN), so
# this is a gap and not a trade -- recorded in STATUS.md, not closed here.
#
# The tie runs from the SYNTHESISED extent to the REAL field, mirroring the
# source: `PS_BldPitchMin_N` is what ROSCO parses and the two extents follow it.
[PitchSaturation]
CntrPar_PS_WindSpeeds_n = { same_as = "CntrPar_PS_BldPitchMin_N" }

# ---------------------------------------------------------------------------
# PowerControlSetpoints (unit #37)
#
# FOUR TIES, AND THEY ARE PitchSaturation's ONE PIN TWICE OVER. This unit calls
# `interp1d` at four sites with two distinct xData/yData families, and the
# generator draws every extent independently:
#
#     interp1d(PRC_R_Table,    PRC_Pitch_Table, PRC_R_Pitch)   the PRC_Mode arm
#     interp1d(OL_Breakpoints, OL_R_Speed,      OL_Index)      the OpenLoop arm
#     interp1d(OL_Breakpoints, OL_R_Torque,     OL_Index)
#     interp1d(OL_Breakpoints, OL_R_Pitch,      OL_Index)
#
# On a case where an xData/yData pair differ, `interp1d`'s upper-clamp arm
# returns `yData(SIZE(xData))` -- past the end of the shorter allocation -- so
# neither implementation has an answer. The untied run PRINTED that state, 14
# times in one run, through interp1d's own diagnostic:
#
#     VIT: interp1d: SIZE(xData) = 4 and SIZE(yData) = 3 are not the same;
#     the reference aborts here (End of record) and this translation continues
#
# and still reported 3596 checked / 0 failed. That is worth being exact about,
# because it is NOT the same result PitchSaturation got from the same defect
# (136 of 1292 failed): passing is what an out-of-bounds read does when the
# slack it lands in happens to agree on both sides, and it is not evidence that
# the domain is admissible. The untied artifact is kept at
# evidence/PowerControlSetpoints/harness.UNTIED-EXTENTS.json.
#
# THE SOURCE LINES THAT FORCE IT, one per family, and in both the arrays are
# allocated from ONE number:
#
#   ReadSetParameters.f90:432-434
#     CALL ParseInput(..., 'PRC_Table_n',     CntrPar%PRC_Table_n, ...)
#     CALL ParseAry(  ..., 'PRC_R_Table',     CntrPar%PRC_R_Table,     CntrPar%PRC_Table_n, ...)
#     CALL ParseAry(  ..., 'PRC_Pitch_Table', CntrPar%PRC_Pitch_Table, CntrPar%PRC_Table_n, ...)
#
#   ReadSetParameters.f90:719, 747, 751, 755 -- all four OL_ arrays are COLUMNS
#   of one matrix, so they share its row count by construction:
#     CntrPar%OL_Breakpoints = CntrPar%OL_Channels(:, CntrPar%Ind_Breakpoint)
#     CntrPar%OL_R_Speed     = CntrPar%OL_Channels(:, CntrPar%Ind_R_Speed)
#     CntrPar%OL_R_Torque    = CntrPar%OL_Channels(:, CntrPar%Ind_R_Torque)
#     CntrPar%OL_R_Pitch     = CntrPar%OL_Channels(:, CntrPar%Ind_R_Pitch)
#
# A case where any of these differ is not a program state ROSCO can reach.
#
# THE COST, STATED, and it is PitchSaturation's cost twice: with each family's
# extents tied, nothing in this harness can distinguish a translation that
# passes `n_OL_Breakpoints` as interp1d's xData extent from one that passes
# `n_OL_R_Speed`, or `n_PRC_R_Table` from `n_PRC_Pitch_Table`. The kernel cannot
# separate them either -- its arrays come from one DISCON.IN -- so this is a gap
# and not a trade.
#
# THE TIE IS TO THE SYNTHESISED xData EXTENT, not to `PRC_Table_n`, and that is
# deliberate. `PRC_Table_n` is a real field of the type and IS the number ROSCO
# parses, but no `_EXTENT_FIELD_PATTERNS` spelling connects it to either array
# (`PRC_R_Table_n`, `n_PRC_R_Table`, ... -- none is `PRC_Table_n`), so the
# generator treats it as an ordinary scalar integer and runs the decade ladder
# over it, up to the representable extremes of a 32-bit INTEGER. Tying an
# ALLOCATION to that parameter would ask the harness to allocate 2^31 doubles.
# It stays free, which is right: it is an input the reference does not read.
[PowerControlSetpoints]
CntrPar_PRC_Pitch_Table_n = { same_as = "CntrPar_PRC_R_Table_n" }
CntrPar_OL_R_Speed_n = { same_as = "CntrPar_OL_Breakpoints_n" }
CntrPar_OL_R_Torque_n = { same_as = "CntrPar_OL_Breakpoints_n" }
CntrPar_OL_R_Pitch_n = { same_as = "CntrPar_OL_Breakpoints_n" }

# ---------------------------------------------------------------------------
# PreFilterMeasuredSignals
#
# TWO PINS, AND BOTH ARE A COUNT THE REFERENCE TIES TO AN EXTENT AND THE
# GENERATOR DRAWS INDEPENDENTLY. The unit's two notch loops are
#
#     DO n = 1,CntrPar%F_GenSpdNotch_N
#         ... CntrPar%F_NotchFreqs(CntrPar%F_GenSpdNotch_Ind(n)) ...
#     DO n = 1,CntrPar%F_TwrTopNotch_N
#         ... CntrPar%F_NotchFreqs(CntrPar%F_TwrTopNotch_Ind(n)) ...
#
# and NOTHING in the unit relates the bound to the array. The relation is
# established by the reference's own reader, `ReadControlParameterFileSub`:
#
#     ReadSetParameters.f90:427-428
#         IF (CntrPar%F_GenSpdNotch_N > 0) THEN
#             CALL ParseAry(..., CntrPar%F_GenSpdNotch_Ind, CntrPar%F_GenSpdNotch_N, ...)
#     ReadSetParameters.f90:430-431   the same two lines for F_TwrTopNotch
#
# so `SIZE(F_GenSpdNotch_Ind) == F_GenSpdNotch_N` by construction, always. The
# generator has no way to know that: R5 draws the extent freely at 3..9 and R6
# gives the count "the decade boundaries and the representable extremes of a
# 32-bit INTEGER, signed". With `F_GenSpdNotch_N = 2147483647` and a
# three-element `F_GenSpdNotch_Ind`, the REFERENCE reads past the array, uses
# whatever it finds as a subscript into `F_NotchFreqs`, and the process dies:
#
#     ./test                                exit 139, SIGSEGV, core dumped
#     the reference's own bridge printed    'VIT bridge: LocalVar%ACC_INFILE
#                                            came back with 34602058 element(s)'
#
# -- a Fortran ALLOCATABLE in the SAME local whose descriptor the out-of-bounds
# writes had already corrupted, which is the tell that the damage is the
# reference's and not the comparison's.
#
# THE UPPER BOUND IS 3 BECAUSE 3 IS THE SMALLEST EXTENT R5 GENERATES. Inside
# 0..3 the loop cannot leave `F_GenSpdNotch_Ind` at any shape the generator
# draws, which is the widest interval that is admissible for every case rather
# than for most of them.
#
# THE COST, STATED. Both counts leave R6's integer ladder, so the decade
# boundaries and the two 32-bit extremes are gone from them -- and every one of
# those values is a value at which the reference has no defined behaviour, so
# nothing observable is lost. What remains is 0 (the loop skipped, which is what
# all 27 scenarios do for TwrTop and what the shipped inputs do when
# `F_NumNotchFilts = 0`), 1 (what six of the 27 scenarios do for GenSpd) and
# 2..3, which no scenario reaches at all.

[PreFilterMeasuredSignals]

CntrPar_F_GenSpdNotch_N = { lo = 0, hi = 3 }
CntrPar_F_TwrTopNotch_N = { lo = 0, hi = 3 }

# SIX MORE PINS, AND EVERY ONE OF THEM IS A SUBSCRIPT. `harness/ranges.toml`
# already carries this exact judgement once, at `[PIDController]` above:
# `objInst%instLPF` is subscripted INSIDE THE CALLEE, against a field of a
# NESTED type the generator does not expand, so no compared out-parameter
# exists to attach a role to and no inference can ever reach it. Unit #34
# measured the reference at SIGSEGV in `__filters_MOD_lpfilter` at both 32-bit
# extremes and at -100000, and pinned it.
#
# MEASURED AGAIN HERE, and the first crash was case 17 of 9447 -- the FIRST case
# whose `ErrVar%aviFAIL` is non-negative, i.e. the first case that runs the body
# at all (cases 0..16 all take the `IF (ErrVar%aviFAIL < 0) RETURN` at the top).
# `evidence/PreFilterMeasuredSignals/harness.case17_probe.txt` is the
# instrumented run: `./test` exits 139, SIGSEGV, core dumped, having printed
# `CASE 17` and nothing after it.
#
# `Filters.f90`'s five filters all index `FP%<name>(inst)` where every `FP`
# array is `DIMENSION(1024)`, and all five end with `inst = inst + 1`. So the
# admissible domain of each counter is 1..1024 MINUS the number of times THIS
# unit advances it before returning, which is not one call but up to eighteen:
#
#     instNotch        F_GenSpdNotch_N + 2*F_TwrTopNotch_N + NumBl*F_GenSpdNotch_N
#                      <= 3 + 6 + 9 = 18
#     instSecLPF       2 + 2 + NumBl + 2                    <= 9
#     instHPF          2 + 1 + NumBl                        <= 6
#     instLPF          2 + 1 + 2                            =  5
#     instNotchSlopes  NumBl                                <= 3
#
# 1000 leaves 24 slots above the worst of them, so no case can reach 1024 by
# advancing a counter, and the pin is one number rather than five.
#
# `LocalVar_NumBl` is the sixth and its bound is the TYPE's, not a measurement:
# `LocalVar%rootMOOP` and `%rootMOOPF` are `DIMENSION(3)` in ROSCO_Types.f90,
# and `DO K = 1,LocalVar%NumBl` subscripts both. A NumBl above 3 is a read and a
# write past a fixed-size array in the reference itself. The generator drew
# -916 and -706 in the first twenty cases, which are harmless (the loop runs
# zero times) and say what the untethered draw would do at the other sign.
#
# THE COST, STATED. All six leave R6's integer ladder -- the decade boundaries
# and the two 32-bit extremes -- and every one of those values is a value at
# which the REFERENCE has no defined behaviour. Nothing observable is lost.
# What is NOT covered, and is worth naming: the corpus can no longer put a
# counter at 1024 itself, so a translation that read `FP%lpf1_a1[inst]` instead
# of `[inst-1]` at the very last slot has nothing here to disagree with. That
# defect class is unreachable for a different reason too -- this unit does not
# index `FP` at all; its callees do, and they are units #9/#11/#13/#14/#18.

objInst_instLPF = { lo = 1, hi = 1000 }
objInst_instSecLPF = { lo = 1, hi = 1000 }
objInst_instHPF = { lo = 1, hi = 1000 }
objInst_instNotch = { lo = 1, hi = 1000 }
objInst_instNotchSlopes = { lo = 1, hi = 1000 }
LocalVar_NumBl = { lo = 0, hi = 3 }

# ---------------------------------------------------------------------------
[ResController]

# ONE ENTRY, AND IT IS THE FIRST IN THIS FILE THAT NAMES THE FUNCTION RESULT.
#
# `ResController` assigns its own result in the ELSE arm only:
#
#     IF (reset) THEN
#         resP%res_OutputSignalLast1(inst) = 0        ! and three more
#     ELSE
#         ResController = 1/b0*( ... )                ! the ONLY assignment
#         ResController = saturate(ResController, minValue, maxValue)
#         ...
#     END IF
#     inst = inst + 1                                 Controllers.f90:1209-1224
#
# so on `reset` the function returns whatever the result slot happens to hold.
# The caller at Controllers.f90:815 assigns that to `AWC_TiltYaw(Imode)`, which
# feeds the inverse Coleman transform and every blade's pitch command. That is
# upstream ROSCO's defect -- the fifth this campaign has recorded -- and it is
# not something a translation can mirror: an undefined value is not a value.
#
# MEASURED BY THIS HARNESS BEFORE THE KEY EXISTED, and the failing artifact is
# kept at evidence/ResController/harness.UNDEFINED-RESULT-3532.json:
#
#     HARNESS FAIL: checked 3532  failed 1763  inadmissible 0
#       case 13 vit_result: ref f2c28ae964943041 != got 0000000000000000
#       case 17 vit_result: ref 777cb0d2ffff0000 != got 0000000000000000
#       case 18 vit_result: ref 10cf0af41fb70000 != got 0000000000000000
#
# All sixteen mismatch records the run keeps name `vit_result` and nothing else,
# and the reference's bytes CHANGE FROM CASE TO CASE -- the 777cb0d2ffff0000
# pattern is a leftover pointer, the same shape `UpdateZeroMQ` produced above.
# That the OTHER 1747 are also `vit_result` is not read off that list, which is
# truncated at sixteen: it is proved by this entry, whose only effect is to stop
# comparing that one output and which takes the same 3532-case corpus from
# `failed 1763` to `failed 0`.
#
# THE COST, STATED, AND IT IS SMALLER HERE THAN THE ALTERNATIVE'S. The obvious
# remedy is `reset = { values = [0] }`, and it is the wrong one: it would throw
# away the whole reset ARM -- four writes that the harness is the ONLY
# instrument able to reach, since those four lines have ZERO hits in all 27
# scenarios and `localvar%restart` is F in all 62 captured kernel cases. This
# excludes the ANSWER instead of the arm, and keeps all 3532 cases.
#
# What is lost is a translation that returns something other than what it
# stores. On the ELSE path the two are the same value by construction --
#
#     resP%res_OutputSignalLast1(inst) = ResController        :1223
#
# -- and `resP_res_OutputSignalLast1` IS compared, on every case, so the
# arithmetic itself is not excluded by this at all. What is no longer compared
# is only the copy of it that leaves through the return, and two other
# instruments do compare that: the kernel replays 62 cases through the CALLER,
# where the result lands in `AWC_TiltYaw`, and the gate runs the whole program.
vit_result = { no_oracle = "assigned in the ELSE arm only; on `reset` the reference returns an undefined slot (Controllers.f90:1209-1224)" }

# TWO MORE, AND THEY ARE `[PIDController]`'s CAUSE 2 MET A SECOND TIME. The
# entry above excludes an ANSWER; these two widen an INPUT domain, because on
# the +/-1e3 default the clamp is active in almost every case and the whole
# Tustin recursion is unobservable behind it.
#
# MEASURED BY THE MUTATION SWEEP RATHER THAN BY A CENSUS PROBE -- the kill
# counts ARE the census, and they are bimodal
# (evidence/ResController/mutation.CLAMPED-CORPUS-3532.txt, 69 behavioural
# mutants on the unpinned corpus):
#
#     killed on     1 of 3532 cases     2 mutants
#     killed on    12 of 3532 cases    21 mutants   <- the ELSE arm's arithmetic
#     killed on    13 of 3532 cases     6
#     killed on    15 of 3532 cases     8
#     killed on    22/23 of 3532        3
#     killed on    75/77/81 of 3532     3
#     killed on  1763 of 3532 cases     8 mutants   <- the reset arm's writes
#     killed on  1769 of 3532 cases     6
#     killed on  3532 of 3532 cases     7 mutants   <- structural
#
# 1766 of the 3532 cases run the ELSE arm and about TWELVE of them let its
# arithmetic reach a compared output. Everything else returns a bound. Score
# 0.9275, and three of the five survivors are that blindness --
# `b0*kp -> b0`, `b0*kp -> b0/kp` and a `2.0 -> 3.0` in a coefficient.
#
# `saturate(x, lo, hi)` is `MIN(MAX(x,lo),hi)`, and R6 draws both bounds from
# one +/-1e3 default with `_base(p, i)`, then its isolating stage pins every
# other defaulted real to 0.0 or 1e300 -- which sets the two bounds EQUAL. An
# empty or inverted interval returns `hi` for every input.
#
# THE RANGES ARE THE ONLY CALL SITE'S OWN SHAPE, widened. Controllers.f90:815 is
# the single call in the whole program:
#
#     ResController(Error(Imode), ..., CntrPar%PC_MinPit, CntrPar%PC_MaxPit, ...)
#
# and all 14 `Examples/DISCON*.IN` carry `PC_MinPit = 0.000`,
# `PC_MaxPit = 1.570` -- physical pitch limits, a non-empty bracket with the
# lower bound at zero. `hi = 0` on minValue KEEPS that real value in the domain
# rather than excluding it, which is where this differs from
# `[PIDController]`'s `hi = -1e-3`: that unit's own call site passes a strictly
# negative lower bound and this one does not.
#
# THE MAGNITUDE IS THE SCALE OF THE CLAMPED EXPRESSION. `1/b0*(...)` divides by
# `b0 = 4 + omega**2*DT**2`, so with omega and DT at the top of the +/-1e3 draw
# the quotient lands around 1e6; 1e9 is above that and 1e-3 is below the small
# end, so the bracket runs from 1e-3 wide to 2e9 wide and the ACTIVE arm keeps
# its coverage.
#
# THE COST, STATED. Both bounds leave R6's MAGNITUDE ladder and its isolating
# stage, so the subnormal/overflow thresholds and 1e+/-300 are gone for these
# two -- values at which the clamp returns a bound for every input, which is the
# blindness this pin exists to remove. An INVERTED bracket (`lo > hi`) is no
# longer generated either: a defect that only shows there would be in
# `saturate`, which is unit #24 and is CALLED rather than inlined, so both sides
# of this comparison reach one implementation of it and this harness never
# constrained it.
minValue = { lo = -1e9, hi = 0 }
maxValue = { lo = 1e-3, hi = 1e9 }

# ---------------------------------------------------------------------------
# SetpointSmoother
#
# ONE ENTRY, AND IT IS THE FIRST IN THIS FILE THAT WIDENS RATHER THAN NARROWS.
#
# The unit is two arms. Every statement it computes -- `R_Total`, both DelOmega
# terms, the `PC_RefSpd` scaling and the LPFilter call -- is on the `SS_Mode ==
# 1` arm; the other arm writes the constant 0. The generated corpus put FOUR
# cases of 5599 on the arm with the arithmetic. That is measured, not inferred:
# two probes deleting one arm each, over the same corpus, fail 4 and 5351, and
# 4 + 5351 = 5355 is exactly what the no-op fails, so the partition closes.
# `objInst%instLPF` is what makes the 4 exact -- LPFilter increments it on every
# call, so an IF-arm case cannot fail to differ when the arm is deleted.
#
#   evidence/SetpointSmoother/harness.if-arm-deleted.5599.json    failed    4
#   evidence/SetpointSmoother/harness.else-arm-deleted.5599.json  failed 5351
#   the no-op, at that corpus (91e3d80f)                          failed 5355
#
# WHY FOUR. `SS_Mode` is an INTEGER with no declared values, so `generate.py`'s
# `flags` list -- `p.values and p.kind != "char[]"` -- does not contain it, and
# `flag_variants` therefore never re-runs R6's 1456 ladder values under it. It
# is reached only by R6's own integer ladder (the decade boundaries and the
# 32-bit extremes, of which 1 is one) and by the knob's 3 combinations. The
# generator PRINTS `PREDICATE KNOB: CntrPar_SS_Mode at [0.0, 1.0, 2.0]` while
# putting four cases on the branch that knob names -- coverage that is announced
# and not delivered, which is P9 at the level of the instrument rather than the
# scenario.
#
# WHAT `values` CHANGES. Declaring them makes `SS_Mode` a flag, and a flag is
# what `flag_variants` crosses EVERY later stage against. The corpus stops being
# a lottery on one integer rung.
#
# WHY THIS ONE IS NOT A NARROWING IN ANY WAY THAT COSTS COVERAGE. The reference
# tests `SS_Mode == 1` and nothing else, so every value other than 1 takes the
# same arm and executes the same single statement. 0 is what the shipped
# `Examples/DISCON*.IN` carry, 1 is the branch under test, and 2 stands for the
# whole of "some other value" -- it is not a mode ROSCO defines. What leaves
# R6's integer ladder is the decade boundaries and the 32-bit extremes ON THIS
# PARAMETER ONLY, and every one of them is behaviourally identical to 2 here.
#
# THE COST, STATED: a defect that reads `SS_Mode` as something other than a
# 3-valued flag -- an overflow on `SS_Mode == 2147483647`, say -- is no longer
# generated. The reference has one integer comparison and no arithmetic on this
# parameter, so there is nothing at those values for such a defect to be.
[SetpointSmoother]
CntrPar_SS_Mode = { values = [0, 1, 2] }

# THE SECOND ENTRY IS FORCED BY THE FIRST, AND IT IS THIS FILE'S OLDEST
# JUDGEMENT MET A FOURTH TIME. Declaring `SS_Mode` moved about a third of the
# corpus onto the arm that CALLS LPFilter, and the reference then died:
#
#     ./test setpointsmoother_cases.bin    Segmentation fault (core dumped), 139
#     CASE 8114 SS_Mode=1 instLPF=-999     <- the first case with both
#
# `LPFilter` subscripts six `DIMENSION(1024)` fields of `FP` with `inst` and
# then advances it. At -999 the REFERENCE reads and writes 999 elements before
# the start of each array. `evidence/SetpointSmoother/harness.case8114_probe.txt`
# is the localisation -- two instrumented runs of the already-built binary, not
# an inference from the missing JSON, which `vit_harness.py` reports as "harness
# produced no JSON" and which reads like a broken harness instead.
#
# 1..1000 is [PIDController]'s, [PreFilterMeasuredSignals]'s and
# [ResController]'s bound unchanged, and this unit is the easiest of the four to
# justify it for: it advances `instLPF` exactly once, so 1000 leaves 23 slots of
# margin below the 1024 the type gives.
#
# THE COST, STATED: `instLPF` leaves R6's integer ladder, so the decade
# boundaries and the 32-bit extremes are gone from it. Every one of those is a
# value at which the REFERENCE has no defined behaviour. What is not covered is
# the last slot -- the corpus can no longer put the counter at 1024 -- and a
# translation that read `FP%lpf1_a1[inst]` instead of `[inst-1]` there would
# have nothing here to disagree with. That defect would be in LPFilter, which is
# unit #14 and is CALLED rather than inlined, so both sides of this comparison
# reach one implementation of it and this harness never constrained it.
objInst_instLPF = { lo = 1, hi = 1000 }

# ---------------------------------------------------------------------------
[Shutdown]

# THREE PINS. THE FIRST IS THIS FILE'S OLDEST JUDGEMENT MET A FIFTH TIME, and it
# is the one that had to be found rather than anticipated: the first generated
# corpus killed the REFERENCE at case 21 with
#
#     In file 'shutdown_bridge.f90': Error allocating 11703869192 bytes
#
# and the localisation is `evidence/Shutdown/harness.case21_probe.txt` -- an
# instrumented run, not an inference from "harness produced no JSON". What it
# shows is worth carrying: the C++ side read `n_PF_TimeStuck = 3` out of the
# case file and the FORTRAN bridge was handed 1462983649, because between the
# read and the call the only thing that ran was the C++ translation, and
# `LPFilter` had written past `FP`'s six `DIMENSION(1024)` arrays and out of
# `LocalVar_a` entirely into the neighbouring stack object.
#
# This unit calls LPFilter FOUR times per call -- pitch, generator speed and the
# two vane components -- so the bound is 1024 - 4, and 1000 is the number the
# other four units already carry.
#
# THE COST, STATED: `instLPF` leaves R6's integer ladder, so the decade
# boundaries and the two 32-bit extremes are gone from it. Every one of those is
# a value at which the REFERENCE has no defined behaviour. The corpus can no
# longer put the counter at 1024, so a defect at the last slot has nothing here
# to disagree with -- and that defect would be in LPFilter, which is unit #11,
# is CALLED rather than inlined, and is therefore the same implementation on
# both sides of this comparison in any case.
objInst_instLPF = { lo = 1, hi = 1000 }

# THE OTHER TWO ARE SUBSCRIPTS THIS UNIT WRITES ITSELF, which makes them a
# different argument from the one above and worth stating separately.
#
# `LocalVar%SD_Stage` indexes three of the four SD_ allocatables:
#
#     SD_Method == 1, second arm    SD_MaxPitchRate(SD_Stage)
#                                   SD_MaxTorqueRate(SD_Stage)
#                                   SD_StageTime(SD_Stage)
#     SD_Method == 2, ELSE arm      SD_MaxPitchRate(SD_Stage)
#                                   SD_MaxTorqueRate(SD_Stage)
#
# and the guard on the first is `SD_Stage .LE. SD_Stage_N`, NOT `1 .LE. SD_Stage
# .AND. SD_Stage .LE. SD_Stage_N`. The reference's own comment on the arm below
# it says "Stage > 0" and the condition does not say so, so every negative
# `SD_Stage` subscripts before the array's start -- in the REFERENCE as much as
# in the translation. 0..3 keeps all three arms live: 0 takes the first,
# 1..SD_Stage_N the second, and anything above SD_Stage_N the third.
LocalVar_SD_Stage = { lo = 0, hi = 3 }

# `CntrPar%SD_Stage_N` bounds the method-2 search loop
#
#     DO I_Stage = 1, CntrPar%SD_Stage_N
#         IF (LocalVar%BlPitchCMeas >= CntrPar%SD_StagePitch(I_Stage)) ...
#
# which subscripts `SD_StagePitch` with the loop counter and therefore has to
# stay inside its extent. R5 varies the four SD_ extents over [3, 4, 5, 6, 7],
# so the smallest allocation any case can present is 3 and the bound is 3. That
# is arithmetic against R5's own ladder, not a round number: raising it to 4
# would put the loop one element past an extent-3 case.
#
# THE COST, STATED: `SD_Stage_N` also leaves R6's integer ladder. What that
# removes is the `SD_Stage > SD_Stage_N` boundary at large magnitudes -- but the
# boundary itself is still reached, because `SD_Stage` runs to 3 and
# `SD_Stage_N` down to 0, so the ELSE arm and the `.LE.` arm both have cases on
# either side of the equality. What is genuinely gone is a corpus in which
# `SD_Stage_N` disagrees with the extents beside it, which is a state
# `ReadControlParameterFileSub` cannot construct: it allocates all four arrays
# from this one count.
CntrPar_SD_Stage_N = { lo = 0, hi = 3 }

[Startup]

# THREE PINS, and all three are subscripts. This unit reads no array it does not
# index with an integer the corpus is free to choose, so every one of them has to
# be bounded here or the reference reads outside its own allocations.

# THE OLDEST JUDGEMENT IN THIS FILE, MET A SIXTH TIME. `objInst%instLPF` is INOUT
# to `LPFilter`, which post-increments it and uses it to subscript `FP`'s six
# `DIMENSION(1024)` arrays -- INSIDE the callee, where no compared
# out-parameter exists for an inference to attach a role to. Unit #41 paid for
# this with `Error allocating 11703869192 bytes` from its own bridge: LPFilter
# had written out of `LocalVar_a` entirely and into the neighbouring stack
# object, and the failure named the harness rather than the counter.
#
# THE ARITHMETIC IS ONE CALL, NOT FOUR. `Shutdown` filters pitch, generator
# speed and the two vane components and so needs 1024 - 4; this unit filters
# rotor speed and nothing else, so 1024 - 1 would do. 1000 is used anyway,
# because it is the number the other five units already carry and a bound that
# differs by 23 buys nothing that could be measured.
#
# THE COST, STATED: `instLPF` leaves R6's integer ladder, so the decade
# boundaries and the two 32-bit extremes are gone from it. Every one of those is
# a value at which the REFERENCE has no defined behaviour. A defect at the last
# slot would be a defect in LPFilter, which is unit #11, is CALLED rather than
# inlined, and is therefore the same implementation on both sides here.
objInst_instLPF = { lo = 1, hi = 1000 }

# `LocalVar%SU_Stage` INDEXES THREE ALLOCATABLES AND THE UNIT WRITES IT ITSELF,
# which makes it a different argument from the counter above.
#
#     :599  SU_LoadRampDuration(SU_Stage-1)   <- inside the .AND. chain, and the
#     :600  SU_LoadHoldDuration(SU_Stage-1)      bound check is the NEXT conjunct
#     :613  SU_LoadRampDuration(SU_Stage-1)   <- guarded by SU_Stage == 2
#     :616  SU_LoadStages(SU_Stage-2)         <- guarded by <= SU_LoadStages_N+1
#     :626  SU_LoadRampDuration(SU_Stage-1)   <- guarded by <= SU_LoadStages_N+1
#     :629  SU_LoadStages(SU_Stage-1)
#     :631  SU_LoadStages(SU_Stage-1)
#
# The binding site is :599. Its guard `SU_Stage .le. SU_LoadStages_N+1` is the
# THIRD conjunct and the two subscripts are in the second, so nothing but this
# pin keeps `SU_Stage-1` inside an extent there. R5 gives the three arrays
# extents 3, 4 and 5 -- `_extent_plan` builds `[3 + bump + i]` and requires them
# pairwise distinct -- so the smallest extent any non-degenerate case can present
# is 3, and `SU_Stage-1 <= 3` gives `hi = 4`.
#
# `lo = -1` rather than 1, and that is the whole point of the low end: -1 is the
# reference's own documented "pre startup waiting for transients" stage, 0 is
# "startup complete", and neither reaches a subscript -- :598's `SU_Stage .ge. 2`
# and :623's `== 1 .OR. == -1` see to that. Cutting the range at 1 would delete
# the two stages the unit spends 10,199 of its 11,999 simulation calls in.
LocalVar_SU_Stage = { lo = -1, hi = 4 }

# `CntrPar%SU_LoadStages_N` never subscripts anything itself; it BOUNDS the two
# arms that do. `:625`'s guard is `SU_Stage .le. SU_LoadStages_N+1` and the arm
# then reads `SU_LoadRampDuration(SU_Stage-1)` and `SU_LoadStages(SU_Stage-1)`,
# so the largest index that guard admits is exactly `SU_LoadStages_N`. Same
# extent-3 floor, so the same 3.
#
# THE COST, STATED: `SU_LoadStages_N` leaves R6's integer ladder, which removes
# the large-magnitude end of the `SU_Stage <= SU_LoadStages_N + 1` and
# `SU_Stage == SU_LoadStages_N + 2` boundaries. The boundaries THEMSELVES are
# still reached from both sides -- `SU_Stage` runs -1..4 against
# `SU_LoadStages_N` 0..3, so `N+1` and `N+2` both land inside the stage range --
# and what is genuinely gone is a corpus where the count disagrees with the
# extents beside it, which is a state `ReadControlParameterFileSub` cannot build:
# it allocates all three arrays from this one count.
CntrPar_SU_LoadStages_N = { lo = 0, hi = 3 }

