# times and the cyclic arm calls `PIController` twice, and the arms are mutually
# exclusive, so the worst case is 3 and the bound could be 1024 - 3. 1000 is
# used anyway, because it is the number the other seven units in this file
# already carry and a bound that differs by 21 buys nothing measurable.
#
# THE COST, STATED: the counter leaves R6's integer ladder. A defect at the last
# slot would be a defect in `PIIController` (unit #35) or `PIController`
# (unit #33), each of which is CALLED rather than inlined here and is therefore
# the same implementation on both sides of this comparison.
objInst_instPI = { lo = 1, hi = 1000 }

# THE BASE-DRAW ENTRY, STATED BEFORE THE MEASUREMENT RATHER THAN AFTER IT, ON
# UNIT #47's AND UNIT #49's FINDING RATHER THAN ON THIS UNIT'S OWN.
#
# `CntrPar%Flp_Mode` is a MODE, and its domain is four values enforced by the
# program itself:
#
#     ROSCO_Types.f90:161  ! Flap actuator mode {0 - off, 1 - fixed flap
#                          !   position, 2 - PI flap control}
#     CheckInputs          IF ((Flp_Mode < 0) .OR. (Flp_Mode > 3)) THEN
#                              aviFAIL = -1
#                              ErrMsg = 'Flp_Mode must be 0, 1, 2, or 3.'
#
# (the check is unit #29's translation, `checkinputs.cpp:303`, transcribed from
# the same statement in the clean Fortran). The +/-1e3 default this file leaves
# an unstated integer at is not a wide statement of that domain, it is a wrong
# one: 1997 of its 2001 values are rejected by the program's own input reader
# before this unit is ever called.
#
# WHY IT MATTERS HERE, AND IT IS THE BASE DRAW AND NOT THE LADDER. `_base` puts
# an unstated integer at `lo + (hi - lo) * 0.65` = **+300**, and `Flp_Mode = 300`
# passes `IF (Flp_Mode > 0)` and then matches NONE of the four arms: the unit
# falls through the whole `ELSEIF` chain and does nothing but copy three
# unchanged `Flp_Angle` elements into `avrSWAP`. Every stage the generator takes
# "with every other input at its base draw" -- R6's real-literal ladder above
# all, which is this unit's only instrument on `Flp_Kp`, `Flp_Ki`, `Flp_MaxPit`,
# `DT`, `rootMOOPF` and `Azimuth` -- would be spent on that path. Unit #49
# measured exactly this on `ErrVar%aviFAIL` and unit #47 on `AWC_Mode`; it is
# recorded in RUNBOOK.md as "a midpoint is not a mode", and this is the first
# unit to act on it BEFORE the survivors rather than after.
#
# `values` AND NOT `lo`/`hi`, for unit #49's reason: a bounds pin moves the base
# draw too, but it also drops the parameter out of R6's integer ladder and
# leaves the value to `rng.randint`, and this unit needs `Flp_Mode` at EXACTLY
# 1, 2 and 3 to reach three different arms. A uniform draw over a four-wide
# interval would supply them unevenly and a `const_tweak` mutant of any of the
# three literals would have no reliable case to die on.
#
# THE ORDER IS DELIBERATE AND `2` IS FIRST. `_case_impl` takes `p.values[0]` as
# the base draw, and the `Flp_Mode == 2` arm is the deepest one this unit has --
# a `PIIController` call, a `saturate` call and a degree conversion, per blade.
# Putting it first is what points R6's ladders at arithmetic instead of at a
# fall-through.
#
# THE COST, STATED.
#   1. `Flp_Mode` leaves R6's integer ladder. This unit reads it in four places
#      and all four are comparisons against 0, 1, 2 and 3, so no decade boundary
#      is distinguishable from a stated value by anything this procedure
#      computes.
#   2. The flag arity of this signature rises by 4 and every flag-crossed stage
#      is taken once per mode, so the corpus grows and every artifact of this
#      unit is a statement about the larger one. The count is recorded in
#      evidence/FlapControl/README.md.
#   3. A `Flp_Mode` far outside the stated set is no longer the base draw, but
#      it is not gone: R7's knob cross-product draws from the reference's own
#      literals and is not filtered by a stated `values` list (unit #49 measured
#      that on `aviFAIL`). The fall-through path therefore still has cases.
CntrPar_Flp_Mode = { values = [2, 0, 1, 3] }

# THE FOURTH PIN, AND IT IS THE FIRST ENTRY IN THIS FILE THAT IS ABOUT A PAIR OF
# INPUTS RATHER THAN ABOUT ONE. It is also the reason `implied_by` exists at all
# (`translation-loop@d947d92`, the eighth judgement kind).
#
# THE REFERENCE READS A LOCAL IT NEVER WRITES.
#
#     Controllers.f90:653   REAL(DbKi) :: RootMyb_VelErr(3)
#     Controllers.f90:670   LocalVar%Flp_Angle(K) =
#                               PIIController(RootMyb_VelErr(K), ...)
#
# `RootMyb_VelErr` is assigned by no statement in `FlapControl` and by no
# statement anywhere else in ROSCO -- `grep -rn RootMyb_VelErr` finds the
# declaration and that one use. In Fortran the value is undefined: whatever the
# stack slot holds. No translation can reproduce it and none should try (P7).
#
# THE SHIPPED PROGRAM NEVER READS IT, AND THAT IS AN INVARIANT RATHER THAN LUCK.
# `PIIController` reads its `error` argument on ONE branch:
#
#     IF (reset) THEN   piP%ITerm(inst) = I0 ... PIIController = I0
#     ELSE              PTerm = kp*error ...
#
# and the call above sits inside `IF (LocalVar%iStatus == 0)`. `ReadAvrSWAP`
# runs at the top of every DISCON call, before every controller, and ends with
#
#     IF (LocalVar%iStatus == 0) THEN ; LocalVar%restart = 1
#     ELSE                            ; LocalVar%restart = 0
#
# (`rosco/controller/src/readavrswap.cpp:161-165`, unit #16, transcribed from
# the same statement in the clean ReadSetParameters.f90). Nothing else in ROSCO
# assigns `LocalVar%restart` -- ROSCO_IO reads and writes it for checkpointing
# and ReadAvrSWAP overwrites it afterwards. So at this unit's call site
# `restart` IS `iStatus == 0`, the init arm always takes `PIIController`'s reset
# branch, and the undefined value is never read. All five gate scenarios run
# that line -- scenario 4 four times -- without depending on it.
#
# THE GENERATOR DREW THE TWO INDEPENDENTLY AND THE HARNESS WENT RED ON 12 OF
# 9721. Measured before this entry existed, and the failing set is exactly the
# predicted region (`evidence/FlapControl/undefined_read_census.txt`):
#
#     cases 9299, 9323, 9371, 9395, 9443, 9467, 9515, 9539, 9587, 9611, 9659, 9683
#     every one:  Flp_Mode = 2, iStatus = 0, restart = 0, NumBl in {1, 2}
#     every one:  LocalVar.piP and nothing else
#
# `piP` alone rather than `Flp_Angle` because those twelve cases happen to hold
# `Flp_Kp = 0` (R6's isolating pin), so `kp*error` is 0 and the saturated sum
# hides the difference the integrator state still records. That is luck and not
# a property: at any non-zero `Flp_Kp` the difference reaches `Flp_Angle` and
# `avrSWAP` as well, which is why `no_oracle = "LocalVar_piP"` was NOT the fix
# taken -- it would have been green on this corpus and silent on the cause.
#
# WHY NOT A PIN ON ONE OF THE FOUR. Each single-parameter narrowing that removes
# the region removes an arm with it: `iStatus /= 0` deletes the whole
# initialisation arm (nine statements), `Flp_Mode /= 2` deletes the PII arm,
# `NumBl = 0` deletes both loops, and `restart` held true sends the mode-2 and
# mode-3 arms down `PIIController`'s and `PIController`'s reset branch, which
# reads neither gain. The relation is what is admissible, so the relation is
# what is stated.
#
# THE COST, STATED. `restart` stops being a free R2 flag: its two values now
# track `iStatus`, so the pair (iStatus /= 0, restart true) leaves the corpus
# along with (iStatus == 0, restart false). Neither pair is producible by the
# program. What IS lost is the ability to catch a translation that read
# `iStatus` where the reference reads `restart`, or the reverse -- the two are
# no longer independent, so no case separates them. This unit reads both, in
# different places (`iStatus == 0` selects the arm; `restart` crosses to the two
# controllers), and that confusion is now invisible to this harness. It is not
# invisible to the gate, which runs the real program in which the implication
# holds and would still be bit-identical, so the honest statement is that this
# harness cannot see it and neither can anything else here.
LocalVar_restart = { implied_by = "LocalVar_iStatus", relation = "== 0", reason = "ReadAvrSWAP sets restart = (iStatus == 0) before every controller call and nothing else in ROSCO assigns it, so the pair the generator draws freely is not producible; the pair (iStatus == 0, restart false) is the only one on which this unit reads RootMyb_VelErr, a local the reference declares and never writes" }

