# IPC
#
# SEVEN PINS AND SIX OF THEM ARE ONE ARGUMENT REPEATED: an extent this unit
# subscripts with a LITERAL, and a per-instance counter a callee post-increments.
# Nothing here is new in kind; the arithmetic behind each one is this unit's.
#
# --- THE FOUR ALLOCATABLE EXTENTS ---
#
# `IPC` reads four `CntrPar` ALLOCATABLE arrays and subscripts every one of them
# with a CONSTANT -- the harness's own plan says so, once per site:
#
#     note: CntrPar_IPC_Vramp[0]:     subscript not traceable to a parameter
#     note: CntrPar_IPC_Vramp[1]:     ...
#     note: CntrPar_IPC_KP[i - 1]:    ... (the DO runs i = 1,2, a literal bound)
#     note: CntrPar_IPC_KI[i - 1]:    ...
#     note: CntrPar_IPC_aziOffset[0]: ...
#     note: CntrPar_IPC_aziOffset[1]: ...
#
# so elements 1 and 2 of each array are read UNCONDITIONALLY, with no ALLOCATED
# test and no bound check anywhere in the procedure. ROSCO's own reader
# allocates each of the four at exactly 2:
#
#     ReadSetParameters.f90:389  ParseAry(..., 'IPC_Vramp',     CntrPar%IPC_Vramp,     2, ...)
#     ReadSetParameters.f90:392  ParseAry(..., 'IPC_KP',        CntrPar%IPC_KP,        2, ...)
#     ReadSetParameters.f90:393  ParseAry(..., 'IPC_KI',        CntrPar%IPC_KI,        2, ...)
#     ReadSetParameters.f90:394  ParseAry(..., 'IPC_aziOffset', CntrPar%IPC_aziOffset, 2, ...)
#
# R5's extent plan is `3 + bump + i`, so the BASE draw is already 3, 4, 5 and 6
# -- above 2, and harmless -- but the ladder sweeps DOWNWARD as well, and an
# extent of 0 or 1 is an out-of-bounds read in the REFERENCE. The two sides read
# out of different allocations there, so the comparison would be adjudicating
# two different pieces of adjacent memory rather than this unit's arithmetic.
#
# THE COST, STATED, AND IT IS SMALLER HERE THAN THE USUAL EXTENT PIN. The four
# arrays leave R5's extent ladder. Nothing observable goes with them: the unit
# reads elements 1 and 2 and nothing else, so extents 3, 4, 5, 6 and 2 are ONE
# input as far as this procedure is concerned, and the plan's six notes say the
# indices were never exercised by R5 in the first place. `hi = 2` rather than a
# larger bound because 2 is what the program itself produces on every run.
[IPC]

CntrPar_IPC_Vramp_n = { lo = 2, hi = 3 }
CntrPar_IPC_KP_n = { lo = 2, hi = 3 }
CntrPar_IPC_KI_n = { lo = 2, hi = 3 }
CntrPar_IPC_aziOffset_n = { lo = 2, hi = 3 }

# --- THE LOOP BOUND ---
#
# `DO K = 1,LocalVar%NumBl` at :565 subscripts FOUR arrays of extent 3, three of
# them procedure LOCALS and one a field:
#
#     REAL(DbKi) :: PitComIPC(3), PitComIPCF(3), PitComIPC_1P(3), PitComIPC_2P(3)
#     ROSCO_Types.f90:357   REAL(DbKi) :: IPC_PitComF(3)
#
# The loop is unguarded and nothing in the reference tests NumBl against 3, so a
# NumBl above 3 writes past a LOCAL and past a fixed-size field in the
# REFERENCE. This is the fifth unit to carry the bound, after
# `[PreFilterMeasuredSignals]`, `[ActiveWakeControl]`, `[FlapControl]` and
# `[ForeAftDamping]`, and the first where the overrun is onto stack locals.
#
# `values` RATHER THAN `lo`/`hi`, ON UNIT #52's MEASUREMENT AND NOT ON A FRESH
# ONE. That dispatch priced the `{ lo = 0, hi = 3 }` spelling three earlier
# units had inherited: it put 98.7% of its corpus at `NumBl == 1`, because a
# bounds pin drops the parameter out of R6's integer ladder and leaves the base
# draw at one value (unit #49). The list is the whole admissible interval with
# every member enumerated, 3 first so the base draw is the configuration ROSCO
# ships -- and R7's predicate knob for this parameter draws [0, 1, 2], every
# member of which is inside the list.
#
# WHY 0 IS KEPT. `NumBl == 0` runs the loop body zero times, and it is the only
# input that separates this unit's two Coleman-inverse calls -- which write all
# three elements of `PitComIPC_1P` and `PitComIPC_2P` whatever NumBl holds --
# from the summation that consumes them. It is also the only input under which
# `LocalVar%IPC_PitComF` arrives and leaves unchanged while every other output
# moves.
#
# THE COST, STATED: NumBl leaves R6's integer ladder, so the decade boundaries
# and the two 32-bit extremes are gone. Every one of those is a value at which
# the reference writes outside its own storage. The gate cannot restore them:
# all five scenarios that reach this unit run NumBl == 3 (the loop's gcov counts
# are 4x the entry count in every one of them), so {0, 1, 2} exist in this
# campaign only in the harness corpus.
LocalVar_NumBl = { values = [3, 0, 1, 2] }

# --- THE THREE INSTANCE COUNTERS ---
#
# THE OLDEST JUDGEMENT IN THIS FILE, AND THIS IS THE FIRST UNIT THAT NEEDS ALL
# THREE OF ITS SPELLINGS AT ONCE. Each counter is INTENT(INOUT) to a callee that
# subscripts a DIMENSION(1024) array with it and then post-increments -- INSIDE
# the callee, where no compared out-parameter exists for an inference to attach
# a role to. Unit #41 paid for the missing bound with
# `Error allocating 11703869192 bytes` from its own bridge.
#
# THE ARITHMETIC, PER COUNTER, WORST CASE OVER THE ARMS:
#
#   instPI      4   the 1P pair plus the 2P pair (IPC_ControlMode >= 2), OR
#                   1 on the yaw-by-IPC arm -- the two arms partition, so 4
#   instSecLPF  1   the yaw-error LPFilter at :516, which is handed the
#                   SECOND-order counter although it is the first-order filter.
#                   That is the reference's choice and is transcribed; see the
#                   note in translations/Controllers/ipc.cpp.
#   instLPF     3   one per blade, inside the loop, on the
#                   `IPC_CornerFreqAct > 0` arm only -- so 0 or NumBl, and NumBl
#                   is bounded at 3 above.
#
# The bound could therefore be 1024 - 4. 1000 is used anyway, because it is the
# number the other units in this file already carry and a bound differing by 20
# buys nothing measurable.
#
# THE COST, STATED: each counter leaves R6's integer ladder. A defect at the
# last slot would be a defect in `PIController` (unit #33) or `LPFilter`
# (unit #14), each of which is CALLED rather than inlined here and is therefore
# the same implementation on both sides of this comparison.
objInst_instPI = { lo = 1, hi = 1000 }
objInst_instLPF = { lo = 1, hi = 1000 }
objInst_instSecLPF = { lo = 1, hi = 1000 }

# --- THE HOLE IN R13's CAPACITY LADDER, PREDICTED THEN MEASURED ---
#
# FIFTH STAGED ASSIGNMENT IN THE CAMPAIGN'S LONGEST CHAIN. Unit #48's rule is to
# COUNT the staged assignments on the path before reading a red on a CHARACTER
# output. `IPC` calls `sigma` four times, each of which ends with
#
#     IF (ErrVar%aviFAIL < 0) ErrVar%ErrMsg = 'sigma'//':'//TRIM(ErrVar%ErrMsg)
#
# and then writes its own `'IPC'//':'//TRIM(...)`. So with an entry message of
# trimmed length m and `aviFAIL < 0` -- which is the base draw here, R7's
# predicate knob puts -1 in it -- the reference's ErrMsg goes
#
#     m -> m+6 -> m+12 -> m+18 -> m+24 -> m+28
#
# THE ARITHMETIC, WRITTEN FROM THE TWO LENGTHS AND THEN CHECKED AGAINST THE RUN.
# The R13 base case supplies m = 7 (`abyz{9:`), so:
#
#     L_final  = 7 + 4*6 + 4 = 35        the reference's own answer
#     L_first  = 7 + 4      = 11         the SHORTEST prefix the chain can write
#                                        -- 'IPC:' is four bytes and 'sigma:' is
#                                        six, so the LAST gate is the cheapest
#
#     cap < 11        every gate on both sides refuses            PASS
#     11 <= cap < 35  the reference's bridge refuses all 35 and
#                     holds the entry value; the translation
#                     writes whatever prefix of the chain fits    FAIL  <- 24
#     cap >= 35       both write 35                               PASS
#
# 35 - 11 = 24 capacities, and the run measured `failed 24`, cases 63660..63683,
# which is exactly k = 4..27 of the ladder (capacity = 7 + k). The two values
# seen in the diff are the two the model predicts: `IPC:aybz{9:` at 11 bytes
# where only the last gate passes, and `sigma:aybz{9:` at 13 where the first
# does and the rest do not.
#
# WHY THE CASE HAS NO ORACLE THERE. The reference chain is Fortran throughout
# with a reallocating `ErrMsg` and ONE capacity gate -- the generated bridge's
# export, on the final 35 bytes. The translation chain gates FIVE times: once in
# each `sigma_c` bridge write-back and once in `assign_errmsg`. Inside the
# window the reference holds the value ErrMsg had ON ENTRY and the translation
# holds a partial composition, and the reference's OWN answer -- 35 bytes of
# `sigma:sigma:sigma:sigma:aybz{9:` prefixed with `IPC:` -- is a value NEITHER
# side can carry. A case whose oracle records something upstream ROSCO never
# produces is not a case this comparison can adjudicate (P7).
#
# THE PRICE, STATED. R13 wants one case AT the boundary, one below and one
# above. The one below (capacity 34) is inside the window and is gone. What
# remains is 35 -- the case that sizes the buffer TO the composed message, and
# the case the boundary mutant `'>' -> '>='` on the refusal is graded by -- 36
# above it, and every capacity from 7 to 10 below. The ladder still runs 232 of
# its 256 rungs.
#
# THIRD UNIT AT THIS SHAPE. `AeroDynTorque` (unit #48) states [16, 29] for a
# two-gate chain and `PitchSaturation` ablated R13 for the same reason without
# stating one. This entry is STRICTLY MORE INPUT than the ablation it replaces:
# `--disable R13_staging_capacity` would drop all 256 rungs to avoid 24.
ErrVar_ErrMsg = { staging_capacity_excludes = [11, 34], reason = "IPC prefixes 'IPC:' onto ErrVar%ErrMsg after its four sigma callees have each prefixed 'sigma:' onto the same buffer, so the translation chain gates the staging buffer FIVE times where the reference chain gates it once, on the final 35 bytes. Inside [11, 35) the reference holds the entry value, the translation holds a partial composition, and the reference's own 35-byte answer is a value neither side can carry -- the case has no oracle. Predicted from the two prefix lengths, then measured at cases 63660..63683 (24 cases, k = 4..27 of the ladder)." }

# ---------------------------------------------------------------------------
# ParseDbAry_Opt                                                     unit #54
#
# TWO PINS. The first is INHERITED FROM A MEASUREMENT THIS CAMPAIGN ALREADY
# TOOK; the second is the corpus half of a translation decision, and it is
# stated here rather than left to be inferred from the .cpp.
#
# `AryLen` -- the same bound `[FindLine]` above carries, for the same reason
# and at the same site. `ParseDbAry_Opt`'s FIRST statement inside the guard is
# `CALL FindLine(FileLines, ParamName, FoundLine, Line, LineNum, AryLen)`, so
# every value of `AryLen` reaches `WordInd = AryLen + 1` and
# `ALLOCATE(Words(WordInd))` unchanged. Unit #32's probe
# (`evidence/FindLine/arylen_probe.txt`, thirteen values, one process each,
# against the clean Fortran) is therefore a probe of THIS unit's domain too:
#
#     -2147483648   SIGSEGV in __rosco_helpers_MOD_findline
#     -100 / -2 / -1   SIGABRT, malloc(): corrupted top size
#     0             returns          <- and it is the `AryLen < 1` arm here
#     1 .. 100000   returns
#     2147483647    SIGSEGV -- AryLen + 1 overflows
#
# `lo = 0` is the boundary and not a margin: `IF (AryLen < 1) FinalAryLen = 1`
# is this unit's own arm and 0 is the only reachable value that takes it --
# the shipped callers pass `CntrPar%F_NumNotchFilts` and friends, which are 0
# in most `Examples/DISCON*.IN`, and coverage records the arm 66 times across
# 21 scenarios. `hi = 32` is a narrowing, stated as one; the reference is
# defined to at least 100000. Copied from `[FindLine]` rather than re-derived.
#
# `UnEc` -- held at the value the SHIPPED PROGRAM has at every one of this
# unit's 1,232 calls, because the arm it gates is NOT TRANSLATED and a corpus
# that drove it would drive it on one side only.
#
#     IF ( PRESENT(UnEc))  THEN
#         IF ( UnEc > 0 )  WRITE (UnEc,*)  LineNum, Tab, ParamName, Tab, Ary
#     END IF
#
# `UnEc` is a Fortran UNIT NUMBER. The record goes to whatever file the CALLER
# connected it to -- `<RootName>.RO.echo`, OPENed by
# `ReadControlParameterFileSub` when `CntrPar%Echo > 0`
# (ReadSetParameters.f90:358-362, clean) -- and C++ cannot reach the Fortran
# runtime's unit table. The only record the translation could write is one to
# `fort.<UnEc>`, a different file, so it writes none; see the comment at the
# statement in `translations/ROSCO_Helpers/parsedbary_opt.cpp`.
#
# THE ARM IS DEAD IN ALL 27 SCENARIOS, measured rather than assumed:
# `coverage/line_coverage.json` has ReadSetParameters.f90:359
# (`IF (CntrPar%Echo > 0)`) reached 28 times and :360 (the first statement
# inside it) ZERO times, so `UnEc` is 0 at every call and the guard is false at
# every one. All 22 `Examples/DISCON*.IN` set `Echo` to 0.
#
# WHAT THE PIN COSTS, stated: `UnEc` leaves R6's ladder and R7's predicate
# knob, so no case in this corpus has `UnEc > 0`. Nothing is lost on the
# translation side -- there is no code there to reach -- and what is lost on
# the REFERENCE side is a side effect no layer of this unit's evidence
# compares. Without the pin the reference would write records to `fort.<N>`
# for arbitrary N, including unit 6, which is the stdout the harness reads its
# own JSON out of.
# ---------------------------------------------------------------------------
[ParseDbAry_Opt]

AryLen = { lo = 0, hi = 32 }
UnEc = { lo = 0, hi = 0 }
