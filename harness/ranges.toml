[ActiveWakeControl]
#
# FOUR PINS. Three are subscripts the reference computes from a count it is also
# handed, and the fourth is the counter shape five other units already carry.
# The fifth candidate -- `LocalVar%restart` -- is deliberately NOT pinned here
