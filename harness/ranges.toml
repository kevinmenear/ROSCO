# UNIT #36's ONE PIN, MET A FOURTH TIME. `FloatingFeedback` passes
# `CntrPar%Fl_U` and `CntrPar%Fl_Kp` to `interp1d` as xData and yData, and the
# generator draws their two extents independently. On a case where they differ,
# `interp1d`'s upper-clamp arm returns `yData(SIZE(xData))` -- past the end of
# the shorter allocation -- so BOTH implementations read out of bounds and
# neither has an answer. Units #36 and #37 measured the two ways that presents:
# 136 of 1292 cases failing on denormals whose bit patterns are small integers
# living next to the allocation, and 3596 checked / 0 failed with interp1d's own
# diagnostic printed 14 times. A pass out of an out-of-bounds read is what
# happens when the slack agrees on both sides; it is not evidence that the
# domain is admissible.
#
# THE SOURCE LINES THAT FORCE IT, and both arrays are allocated from ONE number
# -- ReadSetParameters.f90:514-517:
#
#     CALL ParseInput(..., 'Fl_n',  CntrPar%Fl_n, ...)
#     IF (CntrPar%Fl_n == 0) CntrPar%Fl_n = 1
#     CALL ParseAry(  ..., 'Fl_Kp', CntrPar%Fl_Kp, CntrPar%Fl_n, ...)
#     CALL ParseAry(  ..., 'Fl_U',  CntrPar%Fl_U,  CntrPar%Fl_n, ...)
#
# A case where they differ is not a program state ROSCO can reach.
#
# THE TIE RUNS TO THE SYNTHESISED xData EXTENT AND NOT TO `CntrPar%Fl_n`, for
# unit #37's reason: `Fl_n` is a real field of the type and IS the number ROSCO
# parses, but no `_EXTENT_FIELD_PATTERNS` spelling connects it to either array,
# so the generator treats it as an ordinary scalar integer and runs the decade
# ladder over it up to a 32-bit INTEGER's extremes. Tying an ALLOCATION to that
# would ask the harness for 2^31 doubles. It stays free, which is right: this
# unit does not read it.
#
# THE COST, STATED: with the two extents tied, nothing in this harness can
# distinguish a translation that passes `n_Fl_U` as interp1d's yData extent from
# one that passes `n_Fl_Kp`. Two names for one number across the whole corpus.
# The gate cannot separate them either -- its arrays come from one DISCON.IN --
# so this is a gap and not a trade.
CntrPar_Fl_Kp_n = { same_as = "CntrPar_Fl_U_n" }

