# `CntrPar%AWC_NumModes` BOUNDS THREE DIFFERENT SUBSCRIPTS AND ITS TWO ENDS ARE
# FORCED BY DIFFERENT THINGS.
#
# hi = 2, because the loop counter subscripts two LOCALS of extent 2:
#
#     :775  AWC_TiltYaw(Imode) = D2R*AWC_amp(Imode)*sin(...)     DIMENSION(2)
#     :811  Error(Imode)       = AWC_amp(Imode)*sin(...) + ...   DIMENSION(2)
#     :815/:818  AWC_TiltYaw(Imode) = ResController/PIController(...)
#
# and neither loop is guarded. `AWC_NumModes = 3` writes one element past a
# two-element array ON THE STACK, in the REFERENCE as much as in the
# translation; the reference's own comment at :799 says "If AWC_harmonic > 0,
# use AWC_NumModes=2", which is the same bound stated as advice.
#
# lo = 1, and this end is about a READ rather than a write. `AWC_angle` is the
# one local with no initialiser that a path can reach without writing:
#
#     :774  DO Imode = 1,AWC_NumModes
#     :781      CALL ColemanTransformInverse(..., AWC_angle)   <- the only writer
#     :785  LocalVar%PitCom(K) = LocalVar%PitCom(K) + AWC_angle(K)
#
# With `AWC_NumModes = 0` in Mode 2 the loop body never runs and :785 adds three
# words of whatever the stack held. That is indeterminate in the reference, and
# the two sides of this comparison reach it down call stacks of different depth
# (the C++ side through the generated `colemantransforminverse_c` bridge), so
# they need not even agree on the garbage. Modes 1, 3, 4 and 5 all write
# `AWC_angle` unconditionally and would have been safe at 0.
#
# THE COST, STATED: `AWC_NumModes` leaves R6's integer ladder, so the decade
# boundaries and the two 32-bit extremes are gone from it, along with the
# zero-trip loop in Modes 1, 3 and 4. Every one of those is a value at which the
# reference has no defined behaviour or writes outside its own frame.
CntrPar_AWC_NumModes = { lo = 1, hi = 2 }

# `LocalVar%NumBl` IS THE OTHER LOOP BOUND, AND IT SUBSCRIBES THREE ARRAYS OF
# EXTENT 3 IN ALL FOUR ARMS:
#
#     :761  LocalVar%AWC_complexangle(K)      COMPLEX(DbKi) :: (3)
#     :766  LocalVar%PitCom(K)                REAL(DbKi)    :: (3)
#     :785/:832/:869  AWC_angle(K)            REAL(DbKi), DIMENSION(3)
#
# None of the four loops is guarded, so 3 is the bound. lo = 0 is kept: a
# zero-blade rotor runs no loop body and is defined -- it is the only value at
# which this unit writes no PitCom at all, which is a distinct arm.
LocalVar_NumBl = { lo = 0, hi = 3 }

# THE OLDEST JUDGEMENT IN THIS FILE, MET A SEVENTH AND EIGHTH TIME.
# `objInst%instPI` and `objInst%instRes` are INOUT to `PIController` and
# `ResController`, which subscript `piP`'s five `DIMENSION(1024)` arrays and
# `resP`'s four with the counter and then post-increment it -- INSIDE the
# callee, where no compared out-parameter exists for an inference to attach a
# role to. Unit #41 paid for this with `Error allocating 11703869192 bytes` from
# its own bridge.
#
# THE ARITHMETIC IS TWO CALLS, NOT FOUR: Mode 3 calls `PIController` once per
# mode and `AWC_NumModes` is pinned at 2 above, so the bound is 1024 - 2. Mode 4
# calls `ResController` on the same loop, and Mode 5 calls `PIController` once.
# 1000 is used anyway, because it is the number the other five units already
# carry and a bound that differs by 22 buys nothing that could be measured.
#
# THE COST, STATED: both counters leave R6's integer ladder, so the decade
# boundaries and the two 32-bit extremes are gone from them. Every one of those
# is a value at which the REFERENCE has no defined behaviour, and a defect at
# the last slot would be a defect in PIController (unit #33) or ResController
# (unit #39), each of which is CALLED rather than inlined and is therefore the
# same implementation on both sides of this comparison.
objInst_instPI = { lo = 1, hi = 1000 }
objInst_instRes = { lo = 1, hi = 1000 }

# THE FIFTH PIN, AND IT IS THE ONE THAT HAD TO BE MEASURED. `LocalVar%restart`
# is a PURE PASS-THROUGH here -- it appears in no predicate this unit writes,
# only as the `reset` argument of the two callee calls -- and the first
# clean-tree sweep still came back
#
#     HARNESS FAIL: checked 6436  failed 22  inadmissible 0
#       case 6307 DebugVar.axisTilt_1P: ref 0020217fd5bf0000 != got 2020202020202020
#
# with every one of the sixteen recorded mismatches on `DebugVar.axisTilt_1P`
# and NOTHING else. An instrumented rebuild of the generated test source
# (`evidence/ActiveWakeControl/harness.restart_probe.txt`) printed the four
# inputs per case and named the set exactly: ALL SIXTEEN ARE `AWC_Mode == 4`,
# thirteen of them at `restart == 1` and the other three at `restart == 0`
# IMMEDIATELY AFTER one that was.
#
# `AWC_Mode == 4` is the `ResController` arm, and unit #39 already measured what
# that callee does on its reset arm: it assigns its result ONLY in the ELSE
# branch, so `IF (reset)` returns whatever the result slot holds. That is the
# reference having no answer for its own return value, which the two sides reach
# down call stacks of different depth and need not agree on.
#
# WHAT IS NEW HERE IS THE THREE CASES AT `restart == 0`. This unit stores that
# value into `AWC_TiltYaw`, which is implicitly SAVE, so the indeterminate value
# OUTLIVES THE CASE THAT PRODUCED IT and a later case that does not rewrite the
# slot compares two different leftovers. An indeterminate answer in a SAVE local
# is not confined to its own case.
#
# THE COST, STATED, and it is smaller than the pin looks. What leaves the corpus
# is the reset arm of `PIController` (unit #33) and of `ResController`
# (unit #39). Both are CALLED rather than inlined, so on the clean tree both
# sides of this comparison reach the same Fortran body through the same
# `<callee>_c` bridge, and both were scored against their own corpora as units.
# `PIController`'s reset arm is perfectly determinate -- it assigns `I0` -- and
# is lost only as collateral: `ranges.toml` states a judgement about ONE
# parameter and cannot say "restart may be true unless AWC_Mode is 4".
# Nothing this unit's own body does is removed.
LocalVar_restart = { values = [0] }

# ---------------------------------------------------------------------------
# THE SIXTH AND SEVENTH PINS, ADDED AT THE SECOND DISPATCH OF THIS UNIT, and
# both exist to repair a MEASURED corpus weakness rather than to state a
# narrower domain. `mutation/ActiveWakeControl.json` read 0.7857 with 45
# survivors, and `evidence/ActiveWakeControl/mutation.census.txt` grouped every
# one of them behind a measurement. Two of those measurements are repairable
# here; the rest are instrument gaps and are recorded as such.

# `CntrPar%AWC_Mode` IS AN ENUMERATION, AND WRITING IT AS ONE IS WHAT MAKES
# 97% OF THIS UNIT'S CORPUS REACH AN ARM AT ALL.
#
# MEASURED, on the corpus this pin replaces
# (evidence/ActiveWakeControl/harness.arm_census.txt): of 3231 cases, 3032 sat
# at AWC_Mode = -600 and a further 108 on R6's integer ladder (999999999,
# 99999999, ... -9). NINETY-ONE cases of 3231 reached an arm, and all 91 came
# from the knob cross product. The body is one IF/ELSEIF chain over AWC_Mode
# with NO ELSE, so every other case ran the empty path: the ladders that vary
# Time, the magnitudes that unsaturate a controller, the negative zero, the
# random fill that is the only source of `NumBl == 3` -- every one of them was
# spent on a case that executes nothing. That is not a small loss. It is 32 of
# the 45 survivors.
#
# -600 is not an admissible AWC_Mode. It is `_base`'s midpoint of a +/-1e3
# range nobody chose, on a parameter whose whole domain is the six values the
# reference's own predicates name (1..5) plus the off value ROSCO's input files
# write (0). Stated as `values`, R2 applies: every value appears, and every
# ladder rung is re-run under every one of them, so each arm gets the SAME
# ladders instead of one arm getting all of them.
#
# THE COST, STATED, and it is a cost in TIME rather than in coverage: R2's
# `flag_variants` multiplies the ladder and R6 stages by the SUM of the flag
# arities, so this takes the corpus from 3231 cases to roughly seven times that
# and the mutation sweep with it. Nothing leaves the corpus: AWC_Mode's own
# integer ladder is dropped (a declared range is not laddered), and every value
# it carried -- 999999999 down to -9 -- runs the same empty path that 0 runs.
#
# THE ORDER IS PART OF THE JUDGEMENT AND IS NOT ARBITRARY. `values[0]` is the
# base that every case NOT reached by a flag variant carries, which is the
# first cases in the stream. This unit holds four implicitly-SAVE locals
# (`AWC_TiltYaw`, `Error`, `StartTime`), and a SAVE local's declared
# INITIALISER is observable only before anything has written it -- so only in
# an arm that READS it without necessarily writing it. Modes 3 and 4 are those
# arms: they read `AWC_TiltYaw(1)` and `(2)` through ColemanTransformInverse
# whether or not `LocalVar%Time > StartTime` let the loop above assign them.
# Mode 3 is therefore first. Three mutation survivors (G4 of the census) are
# exactly those initialisers.
CntrPar_AWC_Mode = { values = [3, 4, 5, 1, 2, 0] }

# `CntrPar%AWC_phaseoffset` IS AN ANGLE IN DEGREES, AND ONE TURN IS THE WHOLE
# OF ITS DOMAIN -- so this entry narrows nothing at all.
#
# It is read at exactly three sites, all of them `CntrPar%AWC_phaseoffset*D2R`
# passed as `aziOffset` to ColemanTransformInverse, whose body is
#
#     PitComIPC(k) = cos(nHarmonic*(aziAngle+aziOffset+phi_k))*axTIn + sin(...)
#
# with `nHarmonic` an INTEGER. cos and sin have period 2*PI in their argument
# and `nHarmonic*(aziOffset + 360*D2R)` differs from `nHarmonic*aziOffset` by
# `nHarmonic*2*PI`, so every value outside one turn is the mathematical image
# of one inside it. The domain is the quotient, and [0, 360] covers it.
#
# WHY IT IS NEEDED. MEASURED: `phaseoff = 0` in ALL 91 live cases of the corpus
# this replaces (evidence/ActiveWakeControl/harness.live_case_inputs.txt). Not
# by accident -- `_base` returns `lo + (hi-lo)*frac`, and on the DEFAULTED
# +/-1e3 range the midpoint frac of 0.5 is exactly 0.0. At 0.0 the three
# expressions `x*D2R`, `x` and `x/D2R` are the same bits, so four mutants (G5
# of the census) could not be distinguished by any case. On [0, 360] the same
# midpoint is 180.
#
# THE COST, STATED: R6's real MAGNITUDE ladder runs only on scalar reals whose
# range is defaulted, so this parameter leaves it -- the subnormal,
# flush-to-zero and overflow rungs go, along with the negative-zero case. All
# of them are angles no caller can produce and none of them is a value at which
# the reference changes its answer: the only thing done to this parameter is
# adding it inside a cosine.
CntrPar_AWC_phaseoffset = { lo = 0, hi = 360 }

# ---------------------------------------------------------------------------
# AeroDynTorque
#
# FOUR ENTRIES, AND ALL FOUR ARE INHERITED FROM THE CALLEE RATHER THAN EARNED
# HERE. This unit's own body has no admissibility question in it: six
# statements, two `fmax`es and one divide, defined on every double. What it
# does have is ONE CALL --
#
#     Cp = interp2d(PerfData%Beta_vec, PerfData%TSR_vec, PerfData%Cp_mat, ...)
#
# -- passing three of its own inputs straight into a reference that unit #45
# measured has no answer on two shapes of table. The bridge is KEPT on this
# unit's harness (`harness.sh: keeping the interp2d_c bridge`), so BOTH sides
# run the same Fortran interp2d and both meet the same wall.
#
# THE TWO TIES ARE THE SAME JUDGEMENT interp2d's OWN TABLE CARRIES, one level
# up and under this unit's parameter names. Without them R5 hands the plan
#
#     PerfData_TSR_vec_n 3   PerfData_Beta_vec_n 4
#     PerfData_Cp_mat_rows 5   PerfData_Cp_mat_cols 6
#
# -- pairwise distinct by construction, which is R5's whole point and is here
# the one shape interp2d cannot survive. Both of its size checks then fire on
# EVERY case, and each is
#
#     WRITE(ErrVar%ErrMsg,"(A,I4,A,I4,A)") " SIZE(xData) =", SIZE(xData), ...
#
# formatting 59 characters into `ErrVar%ErrMsg` AS IT STANDS -- a record the
# character ladder makes 1, 2 or 7 bytes long. gfortran ends the process with
# `End of record` and the run produces no cases at all rather than a red one.
#
# THE DIRECTION IS THE MATRIX FOLLOWING THE VECTOR, and which vector is which
# is read from `ReadSetParameters.f90:832`, not from the field names:
# `ALLOCATE(PerfData%Cp_mat(PerfTableSize(2), PerfTableSize(1)))` with
# `Beta_vec` sized (1) and `TSR_vec` sized (2), so Cp_mat is (TSR, Beta) --
# ROWS are TSR. interp2d takes `Beta_vec` as `xData` and checks
# `SIZE(xData) /= SIZE(zData,2)`, so it is COLS that must follow Beta.
#
# THE TABLE HEADER IS THE LINE ABOVE THESE KEYS AND IT IS NOT THE COMMENT
# BANNER. Unit #47 lost a generated corpus to exactly this: a block appended
# under a `# AeroDynTorque` comment lands every key in the PREVIOUS table,
# silently, because TOML is happy and `constrain()` matches by parameter name
# so an unmatched name is simply not applied. Caught here by
# `tomllib.load(...)['AeroDynTorque']` raising KeyError before anything was
# generated; confirm with `--dump-plan`, which prints `bounds_source`.
[AeroDynTorque]
PerfData_Cp_mat_cols = { same_as = "PerfData_Beta_vec_n" }
PerfData_Cp_mat_rows = { same_as = "PerfData_TSR_vec_n" }

# A FIFTH ENTRY, ADDED BY THE SECOND DISPATCH: THE HOLE IN R13'S CAPACITY LADDER.
#
# It replaces `--disable R13_staging_capacity`, and it is STRICTLY MORE INPUT
# than what it replaces -- the ablation dropped all 256 capacities to avoid 14.
#
# THE ARITHMETIC, and it was written down before the failing set was read
# (evidence/AeroDynTorque/harness.staging_composition.txt):
#
#     L_callee = len("interp1d:") + len(TRIM(entry msg)) = 9 + 7  = 16
#     L_final  = len("AeroDynTorque:") + L_callee        = 14 + 16 = 30
#
#     cap  <  16      both sides refuse everything                 PASS
#     16 <= cap < 30  the interp2d_c bridge WRITES 16, and
#                     assign_errmsg then refuses 30                FAIL
#     cap >= 30       both write                                   PASS
#
# The failing window is exactly [L_callee, L_final), which is fourteen
# capacities, and the measured failing set (cases 1140..1153 of the 1387-case
# corpus) is the predicted set.
#
# WHY THE CASE HAS NO ORACLE THERE, which is what makes this a narrowing of the
# ADMISSIBLE domain and not a convenience. The reference chain is Fortran ->
# Fortran -> Fortran with a reallocating `ErrMsg` and ONE capacity gate, the
# generated bridge's export, on the final 30 bytes. The translation chain
# reaches the same Fortran interp2d through the `interp2d_c` bridge and gates
# TWICE: the bridge's write-back on 16, then `assign_errmsg` on 30. Inside the
# window the reference holds the value ErrMsg had ON ENTRY and the translation
# holds the callee's 16 -- and the reference's OWN answer, 30 bytes of
# "AeroDynTorque:interp1d:@ABYZ[^", is a value NEITHER side can carry. A case
# whose oracle records something upstream ROSCO never produces is not a case
# this comparison can adjudicate (P7).
#
# THE PRICE, STATED. R13's design wants one case AT the boundary, one below and
# one above; the one BELOW (capacity 29) is inside the window and is gone. What
# remains is capacity 30 -- the case that sizes the buffer TO the composed
# message -- and 31 above it, plus every capacity from the extent up to 15.
#
# THIS IS NOT THE PRINCIPLED FIX and the principled fix is not available here:
# a case whose REFERENCE-side write-back cannot carry the reference's answer
# should be counted INADMISSIBLE by the generated comparison, which is a count
# the artifact already keeps. That needs the generated Fortran bridge to signal
# its refusal back to the test, and that bridge is written by `vit
# test-validate` -- by VIT, whose swap mid-unit this campaign declined for its
# own reasons (harness.sh's header). Raised in DECISIONS.md.
#
# SECOND UNIT AT THIS SHAPE, not first: `PitchSaturation` double-gated its
# reference for the neighbouring reason (an already-integrated callee re-enters
# C++ through its own bridge over a module staging buffer) and ablated R13 too.
# Its window is [14, 29] and it is NOT stated here -- this entry is one unit's
# judgement and that unit's would have to be measured, not copied.
ErrVar_ErrMsg = { staging_capacity_excludes = [16, 29], reason = "the interp2d_c bridge gates this same buffer on 16 bytes before assign_errmsg gates it on 30, so inside [16,30) the reference and the translation hold two different values and NEITHER is the reference's own 30-byte answer -- the case has no oracle. Predicted from the two lengths, then measured at cases 1140..1153 (harness.staging_composition.txt)." }

# A THIRD AND FOURTH ENTRY WERE WRITTEN AND THE TOOL REFUSED THEM, WHICH IS
# THE RIGHT ANSWER AND IS RECORDED RATHER THAN DELETED.
#
#     PerfData_Beta_vec = { nondecreasing_only = "..." }
#     PerfData_TSR_vec  = { nondecreasing_only = "..." }
#
#     AeroDynTorque: `nondecreasing_only` names PerfData_Beta_vec, but the
#     order ladder does not fire for it -- the reference does not compare two
#     elements of it. An exclusion that excludes nothing reads as a cost that
#     was paid.
#
# The argument for them was unit #45's, inherited through the call: interp2d's
# corner search runs only where `xq > MINVAL(xData)`, and on an INVERTED body
# `j = j - 1` can reach 0 and the reference reads `zData(i, 0)`. The argument
# is about the CALLEE's body. `ordered_only`/`nondecreasing_only` act on the
# ORDER LADDER, and the order ladder is derived from the body of the unit UNDER
# TEST -- which never subscripts these two arrays, so it does not fire and
# there is no inversion to exclude. A judgement that names a hazard the
# instrument does not produce is not a narrowing; it is a claim about coverage
# with nothing behind it.
#
# WHAT REMAINS UNGUARDED, STATED SO IT IS NOT MISTAKEN FOR ABSENT. The random
# fill stratum can still hand interp2d an unsorted axis, and the ramp filler
# (`_fill_array`: lo + span*(k+1) + jitter) cannot. Whether any case reaches
# the out-of-bounds read is a MEASUREMENT and it is taken rather than assumed:
# see the arm census in evidence/AeroDynTorque/.

# ---------------------------------------------------------------------------
# CableControl
#
# FIVE PINS, AND FOUR OF THEM ARE UNIT #43's WORD FOR WORD ONE ARRAY OVER. This
# unit is `StructuralControl`'s twin: same five arguments, same three arms, same
# `Time > 500` step, same `interp1d` row-of-a-2-D-array call, same write loop
# over an `avrSWAP` subscript drawn as a VALUE. Where the reasoning is identical
# it is cited rather than restated, and where it is NOT identical -- the group
# index -- the difference is the whole entry.
#
# `CC_Group_N` bounds ALL THREE of this unit's loops and bounds nothing else:
#
#     Controllers.f90:924  DO I_GROUP = 1,CntrPar%CC_Group_N
#                              ... CntrPar%Ind_CableControl(I_GROUP) ...
#                              ... CntrPar%OL_CableControl(I_GROUP,:) ...
#                              ... LocalVar%CC_DesiredL(I_GROUP) ...
#     Controllers.f90:938  DO I_GROUP = 1, CntrPar%CC_Group_N
#                              ... LocalVar%CC_ActuatedDL(I_GROUP) ...
#                              ... LocalVar%CC_ActuatedL(I_GROUP) ...
#     Controllers.f90:952  DO I_GROUP = 1, CntrPar%CC_Group_N
#                              avrSWAP(CntrPar%CC_GroupIndex(I_GROUP))   = ...
#                              avrSWAP(CntrPar%CC_GroupIndex(I_GROUP)+1) = ...
#
# and NOTHING in this procedure relates the bound to any of the six arrays those
# loops subscript. The relation is established by the reference's own reader:
#
#     ReadSetParameters.f90:577  ParseInput(..., 'CC_Group_N',    CntrPar%CC_Group_N, ...)
#     ReadSetParameters.f90:578  ParseAry(...,   'CC_GroupIndex', CntrPar%CC_GroupIndex,    CntrPar%CC_Group_N, ...)
#     ReadSetParameters.f90:588  ParseAry(..., 'Ind_CableControl', CntrPar%Ind_CableControl, CntrPar%CC_Group_N, ...)
#
# so `SIZE(CC_GroupIndex) == SIZE(Ind_CableControl) == CC_Group_N` by
# construction, always. `CC_DesiredL`, `CC_ActuatedL` and `CC_ActuatedDL` are
# separately fixed at 12 by the type, and the reference's own comment at
# Controllers.f90:890 states the relation the reader enforces: *"LocalVar%CC_Actuated*(),
# and CC_Desired() has a fixed max size of 12, which can be increased in
# rosco_types.yaml"*.
#
# THE UPPER BOUND IS 3 FOR UNIT #43's REASON: 3 is the smallest extent R5
# generates (`_extent_plan` builds `[3 + bump + i]`), so inside 0..3 no loop can
# leave any of the six arrays at any shape the generator draws.
#
# THE COST, STATED. `CC_Group_N` leaves R6's integer ladder, so the decade
# boundaries and the two 32-bit extremes are gone from it -- and every one of
# those is a value at which the REFERENCE reads and writes past six arrays, so
# nothing observable is lost. What remains is 0 (all three loops skipped, which
# is what every scenario that leaves CC_Mode at 0 does), 1 (what all three
# scenarios that enable this unit do) and 2..3, which no scenario reaches.
[CableControl]

CntrPar_CC_Group_N = { lo = 0, hi = 3 }

# THE ONE PIN THAT IS NOT UNIT #43's, AND THE DIFFERENCE IS EXACTLY ONE.
# `CC_GroupIndex(I_GROUP)` is a drawn VALUE used as an `avrSWAP` subscript, as
# `StC_GroupIndex` is -- but this unit writes TWO slots per group:
#
#     avrSWAP(CntrPar%CC_GroupIndex(I_GROUP))     = LocalVar%CC_ActuatedL(I_GROUP)
#     avrSWAP(CntrPar%CC_GroupIndex(I_GROUP)+1)   = LocalVar%CC_ActuatedDL(I_GROUP)
#
# so the last element the reference can touch is `CC_GroupIndex + 1`, not
# `CC_GroupIndex`. `avrSWAP` is an assumed-size dummy, `REAL(ReKi) ::
# avrSWAP(*)`, so the reference has no extent to check against even in principle
# and gfortran cannot bounds-check it. This campaign's stated extent is 3000
# (`vit.yaml` `assumed_size_arrays`), which is also what the harness allocates.
# Unit #43's bound of 3000 would therefore put the SECOND write at element 3001,
# one past the comparison's own buffer, on every case that drew the top of the
# range -- a write past the end rather than a wrong answer. The bound here is
# 2999 and the missing 1 IS the second statement.
#
# The shipped inputs sit far inside it: `CC_GroupIndex` is 2601 in all three
# scenarios that set it (`Examples/vit_sim.py` scenarios 3, 7 and 27), and
# ROSCO's Bladed-style record numbering puts the cable-control block there.
#
# THE COST, STATED, AND IT IS ONE CASE WIDER THAN UNIT #43's. The corpus cannot
# place a group index at 0, at a negative value, past the end of `avrSWAP`, or
# at 3000 -- so a translation that wrote `avrSWAP[idx]` instead of
# `avrSWAP[idx - 1]` still disagrees everywhere inside the range and nothing is
# lost there, but an off-by-one AT the last usable slot has no case to be caught
# on. That defect is undefined behaviour in the reference too, so no oracle
# exists for it.
CntrPar_CC_GroupIndex = { lo = 1, hi = 2999 }

# THE `interp1d` SIZE TIE, FOR THE FOURTH TIME IN THIS FILE -- see `[interp1d]`'s
# `n_yData`, `[PowerControlSetpoints]`'s three OL_ entries and
# `[StructuralControl]`'s `CntrPar_OL_StructControl_cols`. The call is
#
#     interp1d(CntrPar%OL_Breakpoints, CntrPar%OL_CableControl(I_GROUP,:), ...)
#
# and the second argument is a ROW of a 2-D array, so the length that has to
# match `SIZE(OL_Breakpoints)` is the COLUMN count. `_extent_plan` makes extents
# pairwise distinct on purpose, which here means every `CC_Mode == 2` case with
# a positive `Ind_CableControl` would reach `interp1d`'s
# `SIZE(xData) .NE. SIZE(yData)` arm, whose internal WRITE formats 53 characters
# into the 38-character record the statement above it allocated and kills the
# process.
#
# The relation is the reader's, as with the other three: `Read_OL_Input`
# allocates `OL_CableControl(N_OL_Cables, SIZE(CntrPar%OL_Channels, DIM=1))`
# (ReadSetParameters.f90:759) and fills each row from `OL_Channels(:, ...)`,
# whose first dimension is the breakpoint count.
#
# ROWS ARE NOT TIED, deliberately: rows stays distinct from cols, so a
# translation that strode this column-major array by the column count instead of
# the row count still disagrees.
CntrPar_OL_CableControl_cols = { same_as = "CntrPar_OL_Breakpoints_n" }

# THE OLDEST JUDGEMENT IN THIS FILE, MET A NINTH AND TENTH TIME.
# `objInst%instSecLPFV` and `objInst%instPI` are INOUT to `SecLPFilter_Vel` and
# `PIController`, which subscript `FP`'s ten `lpfV_*` DIMENSION(1024) arrays and
# `piP`'s five with the counter and then post-increment it -- INSIDE the callee,
# where no compared out-parameter exists for an inference to attach a role to.
# Unit #41 paid for this with `Error allocating 11703869192 bytes` from its own
# bridge; unit #47 carries the same two lines for `instPI` and `instRes`.
#
# THE ARITHMETIC IS THREE CALLS EACH, NOT ONE: both are called once per group on
# the second loop and `CC_Group_N` is pinned at 0..3 above, so the bound could be
# 1024 - 3. 1000 is used anyway, because it is the number the other six units in
# this file already carry and a bound that differs by 21 buys nothing that could
# be measured.
#
# THE COST, STATED: both counters leave R6's integer ladder, so the decade
# boundaries and the two 32-bit extremes are gone from them. Every one of those
# is a value at which the REFERENCE has no defined behaviour, and a defect at
# the last slot would be a defect in SecLPFilter_Vel (unit #19) or PIController
# (unit #33), each of which is CALLED rather than inlined and is therefore the
# same implementation on both sides of this comparison.
objInst_instSecLPFV = { lo = 1, hi = 1000 }
objInst_instPI = { lo = 1, hi = 1000 }

# A SIXTH PIN, ADDED ON THE SECOND DISPATCH OF THIS UNIT, AND IT IS THE ONE THAT
# MOVES THE BASE DRAW RATHER THAN A LADDER.
#
# `ErrVar%aviFAIL` is the Bladed-interface status ROSCO writes into
# `avrSWAP(129)`. Its domain is three values and the reference's own writers say
# so -- `ErrVar%aviFAIL = -1` on an error (ReadSetParameters.f90, Functions.f90,
# passim), `= 1` on a warning, `= 0` otherwise -- and nothing anywhere assigns
# it anything else. The +/-1e3 DEFAULT this file leaves an unstated integer at
# is therefore not a wide statement of the domain, it is a WRONG one: 1997 of
# its 2001 values are outside the set the program can produce, and the one the
# generator actually uses is the midpoint.
#
# THAT MIDPOINT IS WHY THREE MUTANTS STOOD. `_base` puts an unstated parameter
# at `lo + (hi - lo) * 0.65` for a parameter at this index, which is `+300`, and
# R13's whole 256-case capacity block and R6's character-length rungs are taken
# `with every other input at its base draw` -- so every one of them sat where
# `IF (ErrVar%aviFAIL < 0)` is FALSE and neither ErrMsg helper was entered at
# all. The capacity ladder and the arm that reads the capacity were disjoint,
# and the census that measured it is
# `evidence/CableControl/errmsg_census.txt`:
#
#     cases                                            3354
#     aviFAIL <  0  -- the prefix runs at all           223
#     cases with aviFAIL < 0 and cap == need              0
#     cases with n_ErrMsg == 1 AND aviFAIL < 0            0   (58 have n == 1)
#
# `values` rather than `lo`/`hi`, and the difference is not cosmetic. Both move
# the base draw, because `_case_impl` takes `p.values[0]` for a parameter that
# states values and `_base`'s fraction for one that states bounds -- but a
# `lo`/`hi` pin ALSO drops the parameter out of R6's integer ladder and leaves
# its value to `rng.randint`, and this unit's corpus needs `aviFAIL` at exactly
# 0 and exactly -1 to kill `< 0` widened to `<= 0` and `< 0` tweaked to `< -1`.
# A uniform draw over a 1500-wide interval supplies neither. Stating the three
# values makes `aviFAIL` an R2 FLAG, which is unit #47's fix, and every rung of
# every other ladder is then taken under each of them.
#
# THE COST, STATED, AND IT IS PAID IN CASES RATHER THAN IN COVERAGE.
#   1. `aviFAIL` leaves R6's integer ladder (`q.values` excludes it), so the
#      decade boundaries and the two 32-bit extremes are gone from it. This unit
#      reads `aviFAIL` in exactly one place -- `IF (ErrVar%aviFAIL < 0)`, a pure
#      SIGN test -- so a decade boundary is distinguishable from -1, 0 or 1 by
#      nothing this procedure computes. Nothing observable is lost.
#   2. The flag arity of this signature goes from 2 to 5, and `flag_variants`
#      is additive across flags, so every flag-crossed stage (R_ladder, R6's
#      real literals, R6's character rungs and the planted strings) is taken
#      2.5x. The corpus grows and every artifact of this unit is re-taken over
#      the larger one; the harness and mutation counts either side are recorded
#      in evidence/CableControl/README.md rather than left to be inferred.
#   3. A value far outside the stated set is no longer drawn. That is a
#      narrowing, and it is the one narrowing in this entry that could hide a
#      defect: a translation that tested `aviFAIL < -1` instead of `< 0` is
#      still caught (the corpus holds -1), but one that tested `aviFAIL /= 300`
#      would not be. No such shape exists in the translation, and the mutation
#      operator that could introduce one -- `const_tweak` on the literal 0 --
#      moves it by +/-1, which the stated set separates.
#      MEASURED RATHER THAN ASSUMED, and it is one value WIDER than the set:
#      the corpus's aviFAIL histogram is {-1: 2767, 0: 2446, 1: 2422, 2: 5}.
#      The 2 is R7's knob cross-product, which draws its values from the
#      reference's own literals and is not filtered by a stated `values` list.
#      So `values` states the BASE DRAW and the flag crossing; it does not
#      bound the knob.
ErrVar_aviFAIL = { values = [-1, 0, 1] }

# ---------------------------------------------------------------------------
[FlapControl]

# `LocalVar%NumBl` IS THE ONLY LOOP BOUND IN THIS UNIT, AND IT SUBSCRIPTS TWO
# ARRAYS OF EXTENT 3:
#
#     :670  LocalVar%Flp_Angle(K)      REAL(DbKi) :: Flp_Angle(3)
#     :684  LocalVar%rootMOOPF(K)      REAL(DbKi) :: rootMOOPF(3)
#     :684/:686  LocalVar%Flp_Angle(K)
#
# Neither of the two `DO K = 1,LocalVar%NumBl` loops is guarded, so 3 is the
# bound and a NumBl above it is a read and a write past a fixed-size field in
# the REFERENCE. `lo = 0` is kept: a zero-blade rotor runs neither loop body,
# which is the only configuration in which the `iStatus == 0` arm reaches
# `Flp_Mode == 2` and still writes no `Flp_Angle` through the controller -- a
