# and the two 32-bit extremes are gone from it. Every one of those is a value at
# which the reference writes outside its own fields.
LocalVar_NumBl = { lo = 0, hi = 3 }

# THE OLDEST JUDGEMENT IN THIS FILE, MET AN ELEVENTH TIME. `objInst%instPI` is
# INTENT(INOUT) to both `PIIController` and `PIController`, each of which
# subscripts `piP`'s five DIMENSION(1024) arrays with it and then
# post-increments -- INSIDE the callee, where no compared out-parameter exists
