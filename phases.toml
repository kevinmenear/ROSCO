["E1.2"]
how = "command"
cmd = "bash scripts/assert_fp_contract.sh"
expect_exit = 0
stdout_contains = "0 FMA instruction(s) in libdiscon.so"
note = """Earned 2026-08-10, during unit #2 (ColemanTransform), which is where it \
stopped being deferrable. The unit is five lines of arithmetic and its C++ \
disagreed with the Fortran by ~1 ULP on 105 of 200 random inputs. The cause was \
not the translation: at Release (-O3) gfortran contracted \
`cos(a)*r1 + cos(b)*r2 + cos(c)*r3` into 4 `vfmadd` instructions, confirmed by \
objdump on the shipped `__functions_MOD_colemantransform`. With \
`-ffp-contract=off` the disagreement went to 0 of 200.

Two assertions, because either alone passes while the requirement fails: the \
flag is on the build line CMake emits, AND the linked library contains zero FMA \
instructions. The second is the one that cannot be satisfied by declaring \
anything. Red-tested the same day by blanking the flag and rebuilding: 0 build \
lines, 103 FMA instructions, exit 1.

Whole-library, not per-file, on purpose: a per-file check goes green the moment \
the file under translation is clean and says nothing about the next unit.

Closing this INVALIDATED the baselines, which had been captured from the \
contracted build. Measured footprint before regeneration: 489,734 of 5,252,000 \
values across 90 of 351 channels. baseline_arrays/ was regenerated from clean \
pre-integration source and E3.2 re-run; see E3.5."""

