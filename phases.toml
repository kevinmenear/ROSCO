["E3.1"]
how = "artifact"
path = "gate/__gate__.json"
json_equals = { verdict = "PASS", mismatched = 0, compared = 5252000, unit_of_count = "values" }
note = """Earned 2026-08-10 by `python3 scripts/gate.py __gate__`, which runs the \
27 scenarios, compares every channel against baseline_arrays, prints the \
compared count next to the verdict and PERSISTS it here. `compared` is pinned \
because a count nobody can check is prose.

The count is in VALUES. regress.sh counted CHANNELS -- 351 where the value \
count is 5,252,000 -- and P9 only asserts compared > 0, so a channel-counted \
artifact would have passed while saying four orders of magnitude less than it \
appeared to. It would also not have been evidence about the same instrument \
E3.2 observed failing, since the red test is recorded in values.

Exiting non-zero when NOTHING is compared goes beyond the criterion as written; \
it follows from SPEC §7 and is recorded in DECISIONS.md as a local decision."""

["E3.2"]
how = "artifact"
path = "gate/__gate__.redtest.json"
json_equals = { perturbed = true, went_red = true, revert_verified = true, reverted = true }
note = """Earned 2026-08-10. `scripts/gate.py --perturb-file/--perturb-from/--perturb-to` \
perturbed LPFilter's leading 1.0 to 1.000001_DbKi in Filters.f90:65, rebuilt, \
re-ran all 27 scenarios and moved 1,604,573 of 5,252,000 values across 138 of \
351 channels. Reverting restored 0 of 5,252,000. Both runs of the red test \
produced the identical count, so it is deterministic.

`revert_verified` is asserted, not just `went_red`, because RUNBOOK.md records \
that the first attempt at this red test perturbed a line the scenarios never \
execute and produced a green -- indistinguishable from a gate that cannot fail. \
A red is only attributable to the perturbation if green returns when it is \
removed, so gate.py measures the revert rather than assuming it."""

