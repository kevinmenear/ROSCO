clean pre-integration source, after E1.2 changed the compiler flags and so \
changed the numbers: 20 of 27 scenario_*.npz moved. The gate re-run against the \
regenerated set compares 5,252,000 values with 0 mismatched, and E3.2 was \
re-run against it so the red evidence describes the same baselines the green \
does -- 1,604,573 moved, 0 after revert.

Two limitations, stated rather than left to be discovered. (1) The artifact \
pinned here is the gate's, which shows the baselines are self-consistent with \
the build; it is not independent evidence that the source was clean, which is \
asserted by reset_to_clean.sh having run first. (2) `regress.sh --baseline` \
does NOT restore Examples/DISCON*.IN afterwards -- gate.py's snapshot/restore \
covers gate runs only. Two files were left modified and had to be checked out \
by hand. See DECISIONS.md."""

