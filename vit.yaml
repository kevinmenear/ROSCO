project:
  name: ROSCO
  source_dir: rosco/controller/src
  build_dir: rosco/controller/build
kgen:
  path: /workspace/KGen/bin/kgen
  build_cmd: cd /workspace/ROSCO-r2/rosco/controller/build && cmake --build .
  run_cmd: cd /workspace/ROSCO-r2/Examples && python3 vit_sim.py
  clean_cmd: cd /workspace/ROSCO-r2/rosco/controller/build && make clean
  install_cmd: cp /workspace/ROSCO-r2/rosco/controller/build/libdiscon.so /workspace/ROSCO-r2/rosco/lib/libdiscon.so
  invocation: 0:0:1-20,0:0:12000-12020,0:0:23900-23920
  assumed_size_arrays:
    avrSWAP: 3000
  dll_persistence:
    resets:
    - anchor: CALL ReadAvrSWAP
      code: LocalVar%AlreadyInitialized = 0
build_system:
  type: cmake
  cmake_file: rosco/controller/CMakeLists.txt
  target_name: discon
fortran:
  kind_aliases:
    ReKi: REAL(4)
    DbKi: REAL(8)
    SiKi: REAL(4)
    IntKi: INTEGER(4)
  compiler: gfortran
  flags: -fdefault-real-8 -fdefault-double-8 -ffp-contract=off
verification:
  tolerance: 1.0e-14
translations:
  saturate:
    status: integrated
    cpp_file: translations/Functions/saturate.cpp
  HPFilter:
    status: integrated
    cpp_file: translations/Filters/hpfilter.cpp
