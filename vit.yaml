# VIT configuration for rosco-r2.
#
# DERIVED from ROSCO-replication's vit.yaml AT bf25e35 -- its SETUP commit, the
# revision campaigns/rosco-r2.toml already pins as `src_rev`. Not from its HEAD.
# That distinction is the whole point: at HEAD the file carries 54 integrated
# translations, five `types` entries, a `shared_files` list and a widened kgen
# invocation, all of which were LEARNED DURING the first run. Deriving from HEAD
# would hand this campaign an answer key -- 54 of 69 units pre-declared done,
# and the names of the files a translator is supposed to produce.
#
# Deriving from the setup commit takes only what the first replication knew
# BEFORE it translated anything.
#
# The only substantive change from bf25e35 is mechanical:
#   /workspace/ROSCO-replication -> /workspace/ROSCO-r2   (4 commands)
# Everything else is byte-equal to the source; the added comments are why this
# is declared `derive` rather than `copy`.
#
# NOT carried, because they postdate bf25e35:
#   types.ErrorVariables, types.LocalVariables   (3 types at setup, 5 at HEAD)
#   shared_files:                                (absent at setup entirely)
#   invocation's second range 0:0:20000-20020    (setup had 0:0:1-20)

project:
  name: ROSCO
  source_dir: rosco/controller/src
  build_dir: rosco/controller/build
kgen:
  path: /workspace/KGen/bin/kgen
  build_cmd: cd /workspace/ROSCO-r2/rosco/controller/build && cmake --build .
  run_cmd: cd /workspace/ROSCO-r2/Examples && python3 vit_sim.py
  clean_cmd: cd /workspace/ROSCO-r2/rosco/controller/build && make clean
  install_cmd: cp /workspace/ROSCO-r2/rosco/controller/build/libdiscon.so /workspace/ROSCO-r2/rosco/lib/libdiscon.so
  # WIDENED 2026-08-10 during unit #2, and it took two tries. The setup value
  # 0:0:1-20 is VACUOUS for ColemanTransform: the first 21 invocations at
  # Controllers.f90:510 land at simulation start, where Azimuth and rootMOOPF
  # are 0, so the function was handed zero and expected to return zero in every
  # captured case. A translation reading none of its inputs and writing 0.0
  # passed 21/21 with 4725/4725 IDENTICAL. That artifact is kept, deliberately,
  # under evidence/ColemanTransform/.
  #
  # Widening alone did not fix it. Against scenario 6 -- which coverage shows
  # executing the call site 3,999 times -- invocations 2000-2020 and 3900-3920
  # are ALSO all-zero: scenario 6 is a 1-DOF sim that never drives azimuth or
  # blade root moments, so the line ran 7,998 times on zeros. P9 in one
  # measurement: coverage says a line executed, not that it executed on data
  # that can tell two translations apart.
  #
  # Scenario 27 injects synthetic azimuth and per-blade rootMOOP and has the
  # highest measured hit count at this call site, 23,999. The ranges span its
  # start, middle and end. Chosen from coverage/line_coverage.json, not copied
  # from the first replication.
  invocation: 0:0:1-20,0:0:12000-12020,0:0:23900-23920
  # Interface truth about the Bladed-style array: DISCON receives it as an
  # assumed-size dummy, so nothing in the source states its extent.
  assumed_size_arrays:
    avrSWAP: 3000
  # DISCON holds SAVE state across calls in DLL memory that dlclose() does not
  # reliably release. A replayed kernel must re-enter initialisation.
  dll_persistence:
    resets:
    - anchor: CALL ReadAvrSWAP
      code: LocalVar%AlreadyInitialized = 0
build_system:
  type: cmake
  cmake_file: rosco/controller/CMakeLists.txt
  target_name: discon
fortran:
  kind_aliases:
    ReKi: REAL(4)
    DbKi: REAL(8)
    SiKi: REAL(4)
    IntKi: INTEGER(4)
  compiler: gfortran
  # -ffp-contract=off is E1.2's method requirement, not a preference: without it
  # the compiler may fuse a multiply-add and the two sides stop being
  # bit-comparable. CLOSED 2026-08-10 -- rosco/controller/CMakeLists.txt now
  # passes it to gfortran AND to g++, and scripts/assert_fp_contract.sh checks
  # both the build line and the absence of FMA in the linked library. The gap
  # this comment used to describe was not theoretical: it cost unit #2 a ~1 ULP
  # disagreement on 105 of 200 inputs, and closing it meant regenerating 20 of
  # 27 baselines.
  flags: -fdefault-real-8 -fdefault-double-8 -ffp-contract=off
verification:
  tolerance: 1.0e-14
translations:
  HPFilter:
    status: integrated
    cpp_file: translations/Filters/hpfilter.cpp
  ColemanTransform:
    status: integrated
    cpp_file: translations/Functions/colemantransform.cpp
  AddToList:
    status: integrated
    cpp_file: translations/ROSCO_Helpers/addtolist.cpp
  ColemanTransformInverse:
    status: integrated
    cpp_file: translations/Functions/colemantransforminverse.cpp
  Conv2UC:
    status: integrated
    cpp_file: translations/ROSCO_Helpers/conv2uc.cpp
  # `vit integrate` also wrote `verification: simulation` here. REMOVED, and the
  # removal is the point: it is a claim about what verified this unit, made by a
  # command that ran no simulation and read no result -- the same shape as the
  # `// After verification: <name> kernel PASSED` comment `37f8bdf` deleted from
  # every generated file. It is FALSE for this unit specifically: the gate runs
  # 27 scenarios and is blind to ExtController, and gate/ExtController.redtest.json
  # is the failed red test that says so. What verified it is the differential
  # harness and the mutation score; that lives in plan.json's `evidence`.
  ExtController:
    status: integrated
    cpp_file: translations/ExtControl/extcontroller.cpp
  GetPath:
    status: integrated
    cpp_file: translations/ROSCO_Helpers/getpath.cpp
  GetRoot:
    status: integrated
    cpp_file: translations/ROSCO_Helpers/getroot.cpp
  GetWords:
    status: integrated
    cpp_file: translations/ROSCO_Helpers/getwords.cpp
  Int2LStr:
    status: integrated
    cpp_file: translations/ROSCO_Helpers/int2lstr.cpp
  LPFilter:
    status: integrated
    cpp_file: translations/Filters/lpfilter.cpp
  # ADDED BY HAND at unit #14, not by `vit integrate`. Unit #12 correctly
  # reverted vit.yaml wholesale after a STUB `vit verify` wrote a false
  # `cases_passed` record into it, and `NonDecreasing`'s own entry went with the
  # revert -- so this file listed twelve translations against thirteen
  # integrated units. Recorded by unit #13 as a candidate for the Driver;
  # closed here, because a machine-readable file disagreeing with plan.json is
  # the shape this campaign has been bitten by before.
  NonDecreasing:
    status: integrated
    cpp_file: translations/ROSCO_Helpers/nondecreasing.cpp
  NotchFilter:
    status: integrated
    cpp_file: translations/Filters/notchfilter.cpp
  NotchFilterSlopes:
    status: integrated
    cpp_file: translations/Filters/notchfilterslopes.cpp
  PathIsRelative:
    status: integrated
    cpp_file: translations/ROSCO_Helpers/pathisrelative.cpp
  # ADDED BY HAND at unit #16, for the reason unit #14 recorded: `vit verify`
  # rewrites this file through a YAML round-trip that DELETES EVERY COMMENT in
  # it, so the only way to keep both the entry and the file's own reasoning is
  # to restore the commented file and re-add the entry. `vit integrate` also
  # wrote `verification: simulation` here again; REMOVED again, and this unit is
  # the case that shows why the rule is not pedantry. The gate DID run for
  # ReadAvrSWAP and it DID pass -- and 23 of the unit's 43 output fields are
  # invisible to it (see plan.json `observability`). "Verified by simulation" is
  # a true sentence and a misleading one, written by a command that read no
  # result.
  ReadAvrSWAP:
    status: integrated
    cpp_file: translations/ReadSetParameters/readavrswap.cpp
  # Unit #17, and the FIRST `respecify` unit in this campaign. `status:
  # integrated` here is a statement about the BUILD -- the wrapper ships, the
  # library links and the gate compares 5,252,000 values with 0 mismatched --
  # and NOT about verification. The disposition in plan.json is `blocked`: the
  # differential harness refuses the signature, so there is no mutation score.
  # `vit integrate` also wrote `verification: simulation` here again; removed
  # again, for the reason recorded above ExtController.
  Read_OL_Input:
    status: integrated
    cpp_file: translations/ROSCO_Helpers/read_ol_input.cpp
  # ADDED BY HAND at unit #18, for the reason units #14 and #16 both recorded:
  # `vit verify` rewrites this file through a YAML round-trip that DELETES EVERY
  # COMMENT in it, so restoring the commented file is the only way to keep the
  # file's own reasoning -- and then the entry has to be re-added.
  #
  # `vit integrate` wrote `verification: simulation` here again; REMOVED again.
  # For this unit the gate DID run and DID see it -- 1,349,326 of 5,252,000
  # values moved under a 1.000001 perturbation -- so the line would even have
  # been true, and it is still the wrong claim: it is written by a command that
  # ran no simulation and read no result. What verified this unit is in
  # plan.json's `evidence`.
  SecLPFilter:
    status: integrated
    cpp_file: translations/Filters/seclpfilter.cpp
  SecLPFilter_Vel:
    status: integrated
    cpp_file: translations/Filters/seclpfilter_vel.cpp
  # ADDED BY HAND at unit #20, for the reason units #14, #16 and #18 all
  # recorded: `vit verify` and `vit integrate` rewrite this file through a YAML
  # round-trip that DELETES EVERY COMMENT in it, so restoring the commented
  # file is the only way to keep the file's own reasoning -- and then the entry
  # has to be re-added. Paid for twice here: the second `vit integrate` of this
  # unit stripped the file again, and the `git checkout --` that repaired it
  # took this entry with it.
  #
  # `vit integrate` wrote `verification: simulation` here again; REMOVED again.
  # The gate DID run for this unit and DID see it -- a whole-unit no-op moves
  # 1,526,538 of 5,252,000 values -- and the line is still the wrong claim,
  # written by a command that ran no simulation and read no result. What
  # verified this unit is in plan.json's `evidence`.
  StateMachine:
    status: integrated
    cpp_file: translations/ControllerBlocks/statemachine.cpp
types:
  ControlParameters:
    strategy: view
  PerformanceData:
    strategy: view
  ExtControlType:
    strategy: view
  # ADDED BY `vit translate` at unit #5, not carried from the first replication.
  # The header above says these two were deliberately NOT taken from that
  # campaign's HEAD, because taking them would have been an answer key. These
  # were derived by the tool from THIS tree's ROSCO_Types.f90 -- it detects the
  # ALLOCATABLE fields and writes the entry itself -- so they are a measurement,
  # not a copy, and they are kept for that reason.
  #
  # What they mean today, measured at unit #5 and true until VIT changes:
  # LocalVariables crosses (167 fields, one CHARACTER array, five nested types;
  # `strategy: view` handles all of it). ErrorVariables DOES NOT. Its four
  # fields include `CHARACTER(:), ALLOCATABLE :: ErrMsg`, and `vit translate`
  # refuses it -- "Deferred-length CHARACTER(:) is not C-compatible".
  #
  # So with this entry present `vit interface` emits a five-argument wrapper
  # that USEs `vit_errorvariables_view`, a module nothing can generate: the
  # wrapper will not compile. Without it, the same command silently emitted a
  # three-argument bridge that compiled and could not see `LocalVar%iStatus`.
  # The entry stays because failing to build beats failing silently, and
  # because 37 of this campaign's 69 units take a TYPE(ErrorVariables) dummy --
  # the gap has to be closed in VIT, not routed around here. See DECISIONS.md
  # and plan.json's ExtController entry.
  #
  # `vit analyze-types --fix character` is the remedy VIT's error message
  # suggests, and it is REFUSED here: it rewrites ROSCO's own type definition
  # to a fixed length, which changes LEN(ErrVar%ErrMsg) and so changes the
  # oracle's behaviour. P7.
  LocalVariables:
    strategy: view
  ErrorVariables:
    strategy: view
allocatable:
  helpers:
  - name: ParseAry
    array_arg: 3
    size_arg: 4
