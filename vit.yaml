  # translated function's, and this unit's `errmsg_trim` helper returns a
  # `std::string` -- so `return (std::string(...)) * 1.00001;` does not compile.
  # `cli.py:_run_red_test` treats a build failure as "a red of the crudest kind,
  # and an honest one" and RETURNS ON THE FIRST perturbation, so the two
  # value-level perturbations were never tried. The same shape would fire on
  # `interp1d.cpp` and `sigma.cpp`, which carry the same helper.
  #
  # What this kernel can and cannot see was measured instead, by hand, against
  # the committed kernel: evidence/PitchSaturation/. Seven stubs, of which THREE
  # can fail.
  #
  # `vit integrate` then rewrote this entry to `status: integrated` and added
  # `verification: simulation`. The status is kept; the verification line is
  # REMOVED, for ExtController's reason applied to a case where the claim
  # happens to be TRUE: the gate did run for this unit and did see it --
  # gate/PitchSaturation.json, 5,252,000 values 0 mismatched, red-tested at
  # 1,976,629 moved. But `vit integrate` wrote that word before the gate ran, so
  # what it recorded was a prediction, and a prediction that comes true is still
  # not a measurement. What verified this unit is named in plan.json's
  # `evidence`, which points at artifacts.
  PitchSaturation:
    status: integrated
    cpp_file: translations/ControllerBlocks/pitchsaturation.cpp
  # ADDED BY HAND at unit #37, for the reason units #14, #16, #18, #20, #21,
  # #22, #23, #25, #26, #27, #31, #32, #33 and #35 all recorded: `vit verify`
  # rewrites this file through a YAML round-trip that DELETES EVERY COMMENT in
  # it -- 303 lines of this file's own reasoning on this run's diff -- so
  # restoring the commented file is the only way to keep it, and then the entry
  # has to be re-added. Seventeen units in a row; it is a defect in VIT and it
  # is in DECISIONS.md.
  #
  # `vit verify` also wrote `status: non_discriminating`, `cases_passed: 41`,
  # `red_test: not_constructed` and a `red_test_detail` here. REMOVED, and the
  # refusal is the useful half rather than the count: VIT declined to build a
  # red test because this unit has no by-value floating-point parameter and no
  # floating-point result, which is FindLine's standing at unit #32. So the
  # 41/41 is a pass whose discriminating power VIT itself calls UNMEASURED, and
  # a `cases_passed: 41` in the config every later unit reads does not carry
  # that.
  #
  # It was measured instead, by hand, against the committed kernel, and the
  # answer is that this kernel can see almost nothing: all four outputs are
  # CONSTANT in all 41 captured cases -- 0.9, 1.0, 1.0, 0.0 -- so a translation
  # that reads no input and assigns those four numbers passes 41 of 41. The
  # stubs and their runs are in evidence/PowerControlSetpoints/.
  #
  # `vit integrate` will write `verification: simulation` here; it is REMOVED
  # for ExtController's reason. What verified this unit is in plan.json's
  # `evidence`.
  PowerControlSetpoints:
    status: integrated
    cpp_file: translations/ControllerBlocks/powercontrolsetpoints.cpp
  # Unit #38, and `status: integrated` here is `vit integrate`'s word, written
  # over the `non_discriminating` this file carried before it. `vit integrate`
  # also wrote `verification: simulation`; REMOVED again, for the reason
  # recorded above ExtController -- and it is false twice over for this unit,
  # because the gate's SECOND red test FAILED (`gate/PreFilterMeasuredSignals.
  # redtest.flpmode2.json`, 0 of 5,252,000): the simulation does not see the
  # Flp_Mode == 2 arm at all.
  #
  # `vit verify` reported 62/62 IDENTICAL over 28,582 field rows and
  # then REFUSED to certify its own red test -- "no by-value floating-point
  # parameter and no floating-point result: every input arrives behind a
  # pointer or inside a derived type" -- so it wrote `non_discriminating`
  # rather than a pass. That refusal is kept here verbatim because it is TRUE
  # and because the campaign's rule (units #32, #33, #35) is that a refusal's
  # stated reason is a claim of its own: it is measured by hand in
  # evidence/PreFilterMeasuredSignals/kernel.stubs.txt, not quoted.
  PreFilterMeasuredSignals:
    status: integrated
    cases_passed: 62
    cpp_file: translations/Filters/prefiltermeasuredsignals.cpp
    kernel_dir: kernel/PreFilterMeasuredSignals
    red_test: not_constructed
    red_test_detail: "NOT CONSTRUCTED \u2014 no by-value floating-point parameter\
      \ and no floating-point result: every input arrives behind a pointer or inside\
      \ a derived type, and perturbing one of those could change what BOTH implementations\
      \ compute. The kernel's discriminating power is therefore UNMEASURED for this\
      \ function"
  # Unit #39. `vit verify` ran on the SHIPPED translation, and its own red test
  # went red -- `error` scaled by 1.00001 produced a mismatch. The six hand
  # stubs are in evidence/ResController/kernel.stubs.txt; two of the six cannot
  # fail, and only one of those is a blindness.
  ResController:
    status: verified
    cases_passed: 62
    cases_total: 62
    cases_skipped: 0
    cpp_file: translations/Controllers/rescontroller.cpp
    kernel_dir: kernel/ResController
    red_test: demonstrated
    red_test_detail: the kernel reported a mismatch with input `error` scaled by 1.00001
types:
  ControlParameters:
    strategy: view
  PerformanceData:
    strategy: view
  ExtControlType:
    strategy: view
  # ADDED BY `vit translate` at unit #5, not carried from the first replication.
  # The header above says these two were deliberately NOT taken from that
  # campaign's HEAD, because taking them would have been an answer key. These
  # were derived by the tool from THIS tree's ROSCO_Types.f90 -- it detects the
  # ALLOCATABLE fields and writes the entry itself -- so they are a measurement,
  # not a copy, and they are kept for that reason.
  #
  # What they mean today, measured at unit #5 and true until VIT changes:
  # LocalVariables crosses (167 fields, one CHARACTER array, five nested types;
  # `strategy: view` handles all of it). ErrorVariables DOES NOT. Its four
  # fields include `CHARACTER(:), ALLOCATABLE :: ErrMsg`, and `vit translate`
  # refuses it -- "Deferred-length CHARACTER(:) is not C-compatible".
  #
  # So with this entry present `vit interface` emits a five-argument wrapper
  # that USEs `vit_errorvariables_view`, a module nothing can generate: the
  # wrapper will not compile. Without it, the same command silently emitted a
  # three-argument bridge that compiled and could not see `LocalVar%iStatus`.
  # The entry stays because failing to build beats failing silently, and
  # because 37 of this campaign's 69 units take a TYPE(ErrorVariables) dummy --
  # the gap has to be closed in VIT, not routed around here. See DECISIONS.md
  # and plan.json's ExtController entry.
  #
  # `vit analyze-types --fix character` is the remedy VIT's error message
  # suggests, and it is REFUSED here: it rewrites ROSCO's own type definition
  # to a fixed length, which changes LEN(ErrVar%ErrMsg) and so changes the
  # oracle's behaviour. P7.
  LocalVariables:
    strategy: view
  ErrorVariables:
    strategy: view
